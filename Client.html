  function openAsset(assetId) {
    const requestId = ++state.detailRequestId;
    const content = document.getElementById('detailContent');
    document.getElementById('drawerBackdrop').classList.remove('hidden');
    document.getElementById('detailDrawer').classList.add('open');
    document.getElementById('detailDrawer').setAttribute('aria-hidden', 'false');
    document.getElementById('detailDrawer').setAttribute('aria-busy', 'true');
    content.innerHTML = '<div class="detail-loading" role="status" aria-live="polite"><div class="loading-spinner" aria-hidden="true"></div><h2>Loading asset details</h2><p>Fetching lifecycle history, notifications, and partner actions…</p><div class="loading-skeleton"><span></span><span></span><span></span><span></span></div></div>';

    google.script.run.withSuccessHandler(function (detail) {
      if (requestId !== state.detailRequestId) return;
      renderDetail(detail);
      document.getElementById('detailDrawer').setAttribute('aria-busy', 'false');
    }).withFailureHandler(function (error) {
      if (requestId !== state.detailRequestId) return;
      const info = showAppError_(error, 'Unable to load this asset.');
      document.getElementById('detailDrawer').setAttribute('aria-busy', 'false');
      content.innerHTML = '<div class="detail-error"><h2>' + escapeHtml(info.title) + '</h2><p>' + escapeHtml(info.message) + '</p><button class="button primary" onclick="' + (info.isAuth ? 'refreshApplication_()' : 'openAsset(' + JSON.stringify(assetId).replace(/"/g, '&quot;') + ')') + '">' + (info.isAuth ? 'Refresh & sign in' : 'Try again') + '</button></div>';
    }).getAssetDetail(assetId);
  }

  function renderDetail(detail) {
    const asset = detail.asset;
    const caseRecord = detail.caseRecord;
    const daysSinceRead = Object.prototype.hasOwnProperty.call(asset, 'DAYS_SINCE_READ')
      ? asset.DAYS_SINCE_READ : asset.DAYS_SINCE_ANY_ACTIVITY;
    const fields = [
      ['Asset ID', asset.ASSET_ID],
      ['Snowflake table ID', asset.SNOWFLAKE_TABLE_ID || '—'],
      ['Asset status', asset.ASSET_STATUS], ['Lifecycle state', asset.LIFECYCLE_STATE],
      ['Days since read / creation fallback', daysSinceRead !== '' ? daysSinceRead : 'Signal unavailable'], ['Threshold', asset.STALE_THRESHOLD_DAYS + ' days'],
      ['Read evaluation', asset.SOURCE_ACTIVITY_STATUS || '—'], ['Object created', formatDate(asset.OBJECT_CREATED_DATE)],
      ['Domain', asset.DOMAIN || 'Unassigned'], ['Sub-domain', asset.SUB_DOMAIN || '—'],
      ['Asset type', asset.ASSET_TYPE], ['Rows', asset.ROW_COUNT !== '' ? asset.ROW_COUNT : '—'],
      ['Size', asset.SIZE_GB !== '' ? asset.SIZE_GB + ' GB' : '—'], ['Ownership', asset.OWNERSHIP_STATUS],
      ['Ownership source', asset.OWNERSHIP_SOURCE || '—'], ['Snowflake table owner', asset.SNOWFLAKE_TABLE_OWNER || '—'],
      ['Schema owner', asset.SCHEMA_OWNER_NAME || asset.SCHEMA_OWNER || '—'], ['Schema owner username', asset.SCHEMA_OWNER_USERNAME || '—'],
      ['Schema assignment status', asset.SCHEMA_OWNER_ASSIGNMENT_STATUS || '—'], ['Database owner', asset.DATABASE_OWNER || '—'],
      ['Snowflake data status', asset.SNOWFLAKE_DATA_STATUS || 'ACTIVE'],
      ['DPM team', asset.DPM_TEAM || '—'], ['BDS team', asset.BDS_TEAM || '—'],
      ['Technical steward', asset.TECHNICAL_STEWARD || '—'], ['Business steward', asset.BUSINESS_STEWARD || '—'],
      ['Slack contact coverage', asset.CONTACT_COVERAGE_STATUS || '—'], ['Operational activity', formatDate(asset.LAST_ACTIVITY_TS)],
      ['Days since operational activity', asset.DAYS_SINCE_OPERATIONAL_ACTIVITY !== '' && asset.DAYS_SINCE_OPERATIONAL_ACTIVITY !== undefined ? asset.DAYS_SINCE_OPERATIONAL_ACTIVITY : '—'],
      ['Last read', formatDate(asset.LAST_READ)], ['Last write', formatDate(asset.LAST_WRITE)],
      ['Last load', formatDate(asset.LAST_LOAD)], ['Last altered', formatDate(asset.LAST_ALTERED)],
      ['T0 / intake approval', formatDate(caseRecord && caseRecord.T0)], ['Owner notice due', formatDate(caseRecord && caseRecord.NOTICE_DUE_AT)],
      ['Contest deadline', formatDate(caseRecord && caseRecord.CONTEST_DEADLINE)],
      ['Contest exception ID', caseRecord && caseRecord.CONTEST_REFERENCE || '—'],
      ['Quarantine start', formatDate(caseRecord && caseRecord.QUARANTINE_START_DATE)], ['Purge eligible', formatDate(caseRecord && caseRecord.PURGE_ELIGIBLE_DATE)]
    ];
    const classification = classificationFor(asset.ASSET_STATUS);
    const hasReadSignalGap = /^(INVALID_|MISSING_)/.test(asset.SOURCE_ACTIVITY_STATUS || '');
    const classificationText = asset.ASSET_STATUS === 'QUARANTINED' ? 'Quarantined: Snowflake reports data status RESTRICTED. The lifecycle remains recoverable until the purge process is completed.' : asset.ASSET_STATUS === 'PURGED' ? 'Purged: the platform completed the purge and a complete Snowflake extract verified that the object is absent.' : hasReadSignalGap ? 'Lifecycle retained: the latest extract could not be evaluated for read staleness, so no automatic lifecycle transition was made.' : asset.ASSET_STATUS === 'STALE' ? 'Stale: no qualifying read was recorded inside the configured threshold. Writes, loads, and metadata changes are retained as context but do not reset this clock.' : 'Active: qualifying read activity is inside the configured threshold.';
    let actions = '';
    if (caseRecord) {
      const actionAsset = {
        assetStatus: asset.ASSET_STATUS,
        lifecycleState: caseRecord.STATE,
        permissions: detail.permissions
      };
      const eligibility = assetActionEligibility_(actionAsset);
      const encodedAssetId = JSON.stringify(asset.ASSET_ID).replace(/"/g, '&quot;');
      if (eligibility.confirm) actions += '<button class="button confirm-deprecation" onclick="changeCaseState(' + JSON.stringify(caseRecord.CASE_ID).replace(/"/g, '&quot;') + ',\'ACCEPTED\',\'CONFIRM DEPRECATION\')">CONFIRM DEPRECATION</button>';
      if (eligibility.contest) actions += '<button class="button request-exception" onclick="openContestFlow([' + encodedAssetId + '],' + JSON.stringify(detail.exceptionUrl || '').replace(/"/g, '&quot;') + ',' + JSON.stringify(caseRecord.STATE).replace(/"/g, '&quot;') + ',' + JSON.stringify(caseRecord.CONTEST_REFERENCE || '').replace(/"/g, '&quot;') + ')">CONTEST</button>';
      if (eligibility.selfPurge) actions += '<button class="button dismiss" onclick="requestSelfPurgeFlow_([' + encodedAssetId + '],' + encodedAssetId + ')">SELF PURGE</button>';
      if (eligibility.restore) actions += '<button class="button subtle" onclick="requestRestoreFlow_([' + encodedAssetId + '],' + encodedAssetId + ')">RESTORE</button>';
      if (eligibility.dismiss) actions += '<button class="button dismiss" onclick="changeCaseState(' + JSON.stringify(caseRecord.CASE_ID).replace(/"/g, '&quot;') + ',\'DISMISSED\',\'DISMISS\')">DISMISS</button>';
      if (caseRecord.STATE === 'CONTESTED') actions += '<span class="badge amber">EXCEPTION UNDER REVIEW</span>';
    }
    const events = detail.events.length ? detail.events.map(function (event) {
      const comment = lifecycleEventComment_(event);
      return '<div class="timeline-item"><strong>' + escapeHtml(event.EVENT_TYPE) + '</strong><div>' + escapeHtml((event.FROM_STATE ? event.FROM_STATE + ' → ' : '') + event.TO_STATE) + '</div>' + (comment ? '<p class="timeline-comment">' + escapeHtml(comment) + '</p>' : '') + '<small>' + escapeHtml(formatDate(event.EVENT_AT)) + ' · ' + escapeHtml(event.ACTOR || 'SYSTEM') + '</small></div>';
    }).join('') : '<div class="empty">No lifecycle events recorded.</div>';
    const notices = detail.notifications.length ? detail.notifications.map(function (notice) {
      const canRetry = notice.STATUS === 'FAILED';
      const send = canRetry && state.config.integrations.slack.enabled && state.config.integrations.slack.configured ? '<button class="button primary" onclick="sendDraft(' + JSON.stringify(notice.NOTIFICATION_ID).replace(/"/g, '&quot;') + ',' + JSON.stringify(asset.ASSET_ID).replace(/"/g, '&quot;') + ')">Retry notification</button>' : '';
      const batch = notice.BATCH_SIZE ? ' · ' + notice.BATCH_SIZE + ' assets' : '';
      return '<div class="integration"><span>' + escapeHtml(notice.TYPE + ' · ' + notice.STATUS + batch) + '</span>' + send + '</div>';
    }).join('') : '<div class="empty">No notification records.</div>';
    const platformActions = detail.platformActions.length ? detail.platformActions.map(function (item) {
      const dispatch = (item.STATUS === 'READY' || item.STATUS === 'FAILED') && detail.permissions.canAdmin && state.config.integrations[item.PLATFORM === 'DATA360' ? 'data360Actions' : 'snowflakeActions'].enabled ? '<button class="button primary" onclick="dispatchAction(' + JSON.stringify(item.ACTION_ID).replace(/"/g, '&quot;') + ',' + JSON.stringify(asset.ASSET_ID).replace(/"/g, '&quot;') + ')">Dispatch</button>' : '';
      const simulate = state.config.environment.key === 'DEV' && detail.permissions.canAdmin && ['READY', 'EXPORTED', 'ACCEPTED'].indexOf(item.STATUS) !== -1 ? '<button class="button subtle" onclick="simulateAction(' + JSON.stringify(item.ACTION_ID).replace(/"/g, '&quot;') + ',' + JSON.stringify(asset.ASSET_ID).replace(/"/g, '&quot;') + ')">Simulate completion</button>' : '';
      return '<div class="integration"><span>' + escapeHtml(item.ACTION + ' · ' + item.STATUS) + '</span><span class="integration-actions">' + dispatch + simulate + '</span></div>';
    }).join('') : '<div class="empty">No platform action records.</div>';
    const adminTransitions = detail.adminLifecycleTransitions || [];
    const lifecycleControl = detail.permissions.canAdmin && caseRecord && adminTransitions.length
      ? '<button class="button subtle detail-card-action" onclick="openAdminStatusFlow_(' + JSON.stringify(caseRecord.CASE_ID).replace(/"/g, '&quot;') + ',' + JSON.stringify(asset.ASSET_ID).replace(/"/g, '&quot;') + ',' + JSON.stringify(caseRecord.STATE).replace(/"/g, '&quot;') + ',' + JSON.stringify(adminTransitions).replace(/"/g, '&quot;') + ')">CHANGE STATUS</button>' : '';
    const detailCards = fields.map(function (field) {
      const control = field[0] === 'Lifecycle state' ? lifecycleControl : '';
      return '<div class="detail-card' + (control ? ' detail-card-with-action' : '') + '"><label>' + escapeHtml(field[0]) + '</label><div>' + escapeHtml(field[1] || '—') + '</div>' + control + '</div>';
    }).join('');
    document.getElementById('detailContent').innerHTML = '<div class="eyebrow">' + escapeHtml(asset.PLATFORM + ' · ' + asset.ENVIRONMENT) + '</div><h2 class="detail-title">' + escapeHtml(asset.OBJECT_FQN) + '</h2><p class="detail-sub">' + escapeHtml(asset.ASSET_TYPE + ' · ' + asset.POLICY_RULE) + '</p><div class="classification-box ' + classification.style + '"><strong>' + escapeHtml(classification.label) + '</strong><div>' + escapeHtml(classificationText) + '</div></div><div class="detail-grid">' + detailCards + '</div><div class="action-row">' + actions + '</div><h3 class="section-title">Lifecycle history</h3><div class="timeline">' + events + '</div><h3 class="section-title">Notifications</h3>' + notices + '<h3 class="section-title">Partner actions</h3>' + platformActions;
  }

  function lifecycleEventComment_(event) {
    const raw = event.DETAILS_JSON || event.DETAILS || event.METADATA || '';
    if (!raw) return '';
    try {
      const details = typeof raw === 'string' ? JSON.parse(raw) : raw;
      return String(details.comment || details.notes || details.reason || '').trim();
    } catch (error) {
      return '';
    }
  }

  function openAdminStatusFlow_(caseId, assetId, currentState, transitions) {
    const options = transitions || [];
    if (!options.length) return;
    state.adminStatusFlow = { caseId: caseId, assetId: assetId, currentState: currentState };
    document.getElementById('adminStatusDescription').textContent = 'Current lifecycle status: ' + currentState + '. The selected status will control downstream reminders, notifications, and handoffs.';
    document.getElementById('adminStatusTarget').innerHTML = '<option value="">Select a status</option>' + options.map(function (value) {
      return '<option value="' + escapeHtml(value) + '">' + escapeHtml(humanizeFilterValue_(value)) + '</option>';
    }).join('');
    document.getElementById('adminStatusTarget').onchange = updateAdminStatusImpact_;
    document.getElementById('adminStatusComment').value = '';
    updateAdminStatusImpact_();
    setAdminStatusError_('');
    document.getElementById('adminStatusModal').classList.remove('hidden');
    window.setTimeout(function () { document.getElementById('adminStatusTarget').focus(); }, 0);
  }

  function closeAdminStatusFlow_() {
    state.adminStatusFlow = null;
    document.getElementById('adminStatusModal').classList.add('hidden');
  }

  function adminStatusBackdropClicked_(event) {
    if (event.target === document.getElementById('adminStatusModal')) closeAdminStatusFlow_();
  }

  function setAdminStatusError_(message) {
    const error = document.getElementById('adminStatusError');
    error.textContent = message || '';
    error.classList.toggle('hidden', !message);
  }

  function updateAdminStatusImpact_() {
    const target = document.getElementById('adminStatusTarget').value;
    const impacts = {
      DETECTED: 'Resets the record to newly detected. Pending handoffs are cancelled.',
      NOTIFIED: 'Restarts the response window and sends a new stale-asset notice.',
      CONTESTED: 'Pauses deprecation activity and records a contestation notification.',
      ACCEPTED: 'Confirms deprecation, sends confirmation, and creates a READY quarantine handoff.',
      EXEMPT: 'Pauses deprecation under an administrator override.',
      DISMISSED: 'Removes the record from the active deprecation workflow.',
      QUARANTINED: 'Starts or preserves quarantine dates and sends the quarantine notice.',
      PURGE_ELIGIBLE: 'Makes the asset immediately available for pre-purge review and attestation.',
      SELF_PURGE_PENDING: 'Cancels partner handoffs and waits for a later import to verify absence.',
      RESTORED: 'Cancels pending handoffs and sends a restoration confirmation.',
      PURGED: 'Closes the lifecycle as purged and sends a purge-completed notification.',
      ACTIVE: 'Stops lifecycle actions and treats the managed record as active.'
    };
    const impact = document.getElementById('adminStatusImpact');
    impact.textContent = target ? impacts[target] || '' : 'Choose a status to preview its downstream effect.';
  }

  function submitAdminStatusFlow_() {
    const flow = state.adminStatusFlow;
    if (!flow) return;
    const targetState = document.getElementById('adminStatusTarget').value;
    const comment = document.getElementById('adminStatusComment').value.trim();
    if (!targetState) {
      setAdminStatusError_('Select a new lifecycle status.');
      document.getElementById('adminStatusTarget').focus();
      return;
    }
    if (!comment) {
      setAdminStatusError_('A comment is required for this status change.');
      document.getElementById('adminStatusComment').focus();
      return;
    }
    setAdminStatusError_('');
    document.getElementById('adminStatusSubmit').disabled = true;
    showWorkflowLoading_('Updating lifecycle status', 'Recording the administrator update and comment in lifecycle history…');
    google.script.run.withSuccessHandler(function (detail) {
      hideWorkflowLoading_();
      document.getElementById('adminStatusSubmit').disabled = false;
      const assetId = flow.assetId;
      closeAdminStatusFlow_();
      loadDashboard(state.page);
      renderDetail(detail);
      showToast('Lifecycle status updated to ' + targetState + '.');
    }).withFailureHandler(function (error) {
      hideWorkflowLoading_();
      document.getElementById('adminStatusSubmit').disabled = false;
      const info = showAppError_(error, 'Unable to change lifecycle status.');
      setAdminStatusError_(info.message);
    }).adminChangeLifecycleStatus({ caseId: flow.caseId, targetState: targetState, comment: comment });
  }

  function notificationOptions(current) {
    const map = {
      DETECTED: [['STALE_ASSET_NOTICE', 'Initial stale asset notice']],
      NOTIFIED: [['CONTESTATION_REMINDER', 'Contestation reminder'], ['OWNER_ESCALATION', 'Owner escalation']],
      CONTESTED: [['CONTESTATION_RECEIVED', 'Contestation received']],
      ACCEPTED: [['DEPRECATION_ACCEPTED', 'Deprecation accepted']],
      QUARANTINED: [['QUARANTINE_NOTICE', 'Quarantine notice'], ['PURGE_NOTICE_30_DAY', '30-day purge notice']],
      RESTORED: [['RESTORATION_CONFIRMED', 'Restoration confirmed']],
      PURGED: [['PURGE_COMPLETED', 'Purge completed']]
    };
    return map[current] || [];
  }

  function changeCaseState(caseId, nextState, actionLabel) {
    const label = actionLabel || nextState;
    const notificationTypes = ['CONTESTED', 'ACCEPTED'];
    const sendsNotification = notificationTypes.indexOf(nextState) !== -1 && label !== 'DISMISS';
    showConfirmation({
      title: label === 'DISMISS' ? 'Dismiss candidate' : label === 'CONFIRM DEPRECATION' ? 'Confirm deprecation' : 'Move to ' + nextState,
      message: label === 'DISMISS' ? 'Dismiss this deprecation candidate?' : 'Move this case to ' + nextState + '?',
      detail: nextState === 'ACCEPTED' ? 'A consolidated Slack confirmation will be sent and a READY Snowflake quarantine request will be created automatically.' : sendsNotification ? 'The applicable Slack notification will be sent automatically.' : label === 'DISMISS' ? 'This record will leave the active deprecation path. No Slack notification will be sent.' : '',
      confirmLabel: label === 'DISMISS' ? 'Dismiss' : label === 'CONFIRM DEPRECATION' ? 'Confirm deprecation' : 'Continue',
      confirmClass: label === 'DISMISS' ? 'dismiss' : label === 'CONFIRM DEPRECATION' ? 'confirm-deprecation' : 'primary',
      iconClass: label === 'CONFIRM DEPRECATION' ? 'green' : ''
    }, function () {
      showWorkflowLoading_(
        nextState === 'ACCEPTED' ? 'Confirming deprecation' : 'Updating lifecycle',
        nextState === 'ACCEPTED'
          ? 'Updating the lifecycle record, preparing the quarantine handoff, and sending the Slack confirmation…'
          : 'Updating the lifecycle record and completing the requested action…'
      );
      google.script.run.withSuccessHandler(function (detail) {
        hideWorkflowLoading_();
        renderDetail(detail); loadDashboard(state.page);
        const delivered = detail.notificationAutomation && detail.notificationAutomation.assetCount;
        showToast(label === 'DISMISS' ? 'Deprecation candidate dismissed.' : 'Case moved to ' + detail.caseRecord.STATE + '.' + (delivered ? ' Slack notification sent automatically.' : ''));
      }).withFailureHandler(function (error) {
        hideWorkflowLoading_();
        showToast(error.message || String(error), true);
      }).transitionCaseAndNotify(caseId, nextState, '');
    });
  }

  function queueAction(assetId, action) {
    if (action === 'PURGE') {
      showConfirmation({
        title: 'Complete pre-purge attestation',
        message: 'Prepare this asset for permanent purge?',
        detail: 'By continuing, you attest that there is no legal hold, no regulatory or audit retention obligation, no pending restoration request, and EDG sign-off has been received.',
        confirmLabel: 'Attest & prepare purge',
        confirmClass: 'danger',
        iconClass: 'red'
      }, function () {
        runServer('queuePurgeAction', {
          assetId: assetId,
          checks: { noLegalHold: true, noRegulatoryRetention: true, noPendingRestoration: true, edgSignoff: true }
        }, function (record) {
          showToast('Purge request ' + record.STATUS.toLowerCase() + ' created with the pre-purge attestation.');
          openAsset(assetId);
          loadAdminOperations();
        });
      });
      return;
    }
    runServerTwo('queuePlatformAction', assetId, action, function (record) { showToast(action + ' request ' + record.STATUS.toLowerCase() + ' created.'); openAsset(assetId); });
  }

  function sendDraft(notificationId, assetId) {
    showConfirmation({ title: 'Retry notification', message: 'Retry this failed consolidated Slack notification now?', detail: 'Every eligible asset in the failed recipient and message-type group will be retried together.', confirmLabel: 'Retry notification', confirmClass: 'primary' }, function () {
      runServer('sendNotification', notificationId, function (record) { showToast('Consolidated Slack notification retry succeeded for ' + (record.BATCH_SIZE || 1) + ' asset' + (Number(record.BATCH_SIZE || 1) === 1 ? '' : 's') + '.'); openAsset(assetId); loadDashboard(state.page); });
    });
  }

  function dispatchAction(actionId, assetId) {
    showConfirmation({ title: 'Dispatch partner action', message: 'Dispatch this request to the partner platform now?', detail: 'This sends the approved request to the configured external platform endpoint.', confirmLabel: 'Dispatch', confirmClass: 'primary', iconClass: 'orange' }, function () {
      runServer('dispatchPlatformAction', actionId, function () { showToast('Partner action dispatched.'); openAsset(assetId); });
    });
  }

  function simulateAction(actionId, assetId) {
    showConfirmation({ title: 'Simulate partner completion', message: 'Mark this DEV partner action completed?', detail: 'This test-only action applies the same lifecycle outcome expected from a Snowflake or Data 360 callback.', confirmLabel: 'Simulate completion', confirmClass: 'primary', iconClass: 'orange' }, function () {
      runServer('recordPlatformActionResult', { actionId: actionId, status: 'COMPLETED', partnerReference: 'DEV-SIMULATED' }, function () {
        showToast('DEV partner completion recorded.'); openAsset(assetId); loadDashboard(state.page);
      });
    });
  }

  function openContestFlow(assetIds, exceptionUrl, lifecycleState, existingExceptionId) {
    const ids = (assetIds || []).filter(Boolean);
    if (!ids.length) return;
    const completingContest = lifecycleState === 'CONTESTED';
    state.exceptionFlow = { mode: completingContest ? 'EXEMPT' : 'CONTEST', assetIds: ids, exceptionUrl: exceptionUrl || '', exceptionBaseUrl: '' };
    document.getElementById('exceptionFlowTitle').textContent = completingContest ? 'Complete approved exception' : 'Contest stale designation';
    document.getElementById('exceptionFlowDescription').textContent = completingContest
      ? 'Deprecation is paused under exception ' + (existingExceptionId || 'request').toUpperCase() + '. Confirm the approved exception details to mark the asset Exempt.'
      : 'Enter an approved exception ID. It must exist with ACTIVE status in the exception database before this contest can pause quarantine and purge work.';
    document.getElementById('contestFields').classList.toggle('hidden', completingContest);
    document.getElementById('exemptFields').classList.toggle('hidden', !completingContest);
    document.getElementById('contestExceptionId').value = completingContest ? '' : (existingExceptionId || '').toUpperCase();
    document.getElementById('approvedExceptionId').value = completingContest ? (existingExceptionId || '').toUpperCase() : '';
    document.getElementById('approvedExceptionExpires').value = '';
    document.getElementById('approvedExceptionUrl').value = '';
    configureExceptionLinks_(exceptionUrl, existingExceptionId || '');
    setExceptionFlowError_('');
    const submit = document.getElementById('exceptionFlowSubmit');
    submit.textContent = completingContest ? 'Submit approved exception' : 'Contest';
    submit.className = 'button request-exception';
    document.getElementById('exceptionFlowModal').classList.remove('hidden');
    window.setTimeout(function () {
      document.getElementById(completingContest ? 'approvedExceptionId' : 'contestExceptionId').focus();
    }, 0);
  }

  function openExemptFlow(assetIds) {
    const ids = (assetIds || []).filter(Boolean);
    if (!ids.length) return;
    state.exceptionFlow = { mode: 'EXEMPT', assetIds: ids, exceptionUrl: state.config.exceptionAppUrl || '', exceptionBaseUrl: '' };
    document.getElementById('exceptionFlowTitle').textContent = 'Record approved exception';
    document.getElementById('exceptionFlowDescription').textContent = 'Enter the approved exception ID that applies to ' + ids.length + ' asset' + (ids.length === 1 ? '' : 's') + '. This immediately marks the lifecycle Exempt and cancels pending quarantine or purge work.';
    document.getElementById('contestFields').classList.add('hidden');
    document.getElementById('exemptFields').classList.remove('hidden');
    document.getElementById('approvedExceptionId').value = '';
    document.getElementById('approvedExceptionExpires').value = '';
    document.getElementById('approvedExceptionUrl').value = '';
    configureExceptionLinks_(state.config.exceptionAppUrl || '', '');
    setExceptionFlowError_('');
    const submit = document.getElementById('exceptionFlowSubmit');
    submit.textContent = 'Mark Exempt';
    submit.className = 'button request-exception';
    document.getElementById('exceptionFlowModal').classList.remove('hidden');
    window.setTimeout(function () { document.getElementById('approvedExceptionId').focus(); }, 0);
  }

  function configureExceptionLinks_(url, exceptionId) {
    const supplied = url || (state.config && state.config.exceptionAppUrl) || '';
    let baseUrl = '';
    if (supplied) {
      try {
        const parsed = new URL(supplied, window.location.href);
        parsed.hash = '';
        baseUrl = parsed.origin + parsed.pathname;
      } catch (error) {
        baseUrl = supplied.split('?')[0];
      }
    }
    if (state.exceptionFlow) state.exceptionFlow.exceptionBaseUrl = baseUrl;
    const requestLink = document.getElementById('exceptionRequestInlineLink');
    requestLink.href = baseUrl ? baseUrl + '?page=dashboard' : '#';
    requestLink.setAttribute('aria-disabled', baseUrl ? 'false' : 'true');
    updateExceptionRecordLink(exceptionId);
  }

  function updateExceptionRecordLink(suppliedId) {
    const flow = state.exceptionFlow;
    if (!flow) return;
    const fieldId = flow.mode === 'CONTEST' ? 'contestExceptionId' : 'approvedExceptionId';
    const exceptionId = String(suppliedId || document.getElementById(fieldId).value || '').trim().toUpperCase();
    const valid = /^EDG-EXC-\d{4}-\d{3,}$/.test(exceptionId);
    const recordUrl = valid && flow.exceptionBaseUrl ? flow.exceptionBaseUrl + '?page=exception&id=' + encodeURIComponent(exceptionId) : '';
    const recordLink = document.getElementById('exceptionRecordLink');
    recordLink.href = recordUrl || '#';
    recordLink.classList.toggle('hidden', !recordUrl);
    if (flow.mode === 'EXEMPT') document.getElementById('approvedExceptionUrl').value = recordUrl;
  }

  function submitExceptionFlow() {
    const flow = state.exceptionFlow;
    if (!flow) return;
    const submit = document.getElementById('exceptionFlowSubmit');
    submit.disabled = true;
    if (flow.mode === 'CONTEST') {
      const exceptionId = document.getElementById('contestExceptionId').value.trim().toUpperCase();
      if (!exceptionId) {
        submit.disabled = false;
        setExceptionFlowError_('Enter an approved exception ID before contesting.');
        document.getElementById('contestExceptionId').focus();
        return;
      }
      if (!/^EDG-EXC-\d{4}-\d{3,}$/.test(exceptionId)) {
        submit.disabled = false;
        setExceptionFlowError_('Use the exception ID format EDG-EXC-2026-009.');
        document.getElementById('contestExceptionId').focus();
        return;
      }
      setExceptionFlowError_('');
      showWorkflowLoading_('Validating exception', 'Checking that the exception exists and is ACTIVE before recording the contest…');
      google.script.run.withSuccessHandler(function (result) {
        hideWorkflowLoading_();
        submit.disabled = false;
        closeExceptionFlow();
        clearBulkSelection();
        loadDashboard(state.page);
        if (flow.assetIds.length === 1) openAsset(flow.assetIds[0]);
        const notice = result.notificationAutomation && result.notificationAutomation.assetCount ? ' Contestation confirmation sent.' : result.notificationError ? ' Contest recorded; Slack delivery needs attention.' : '';
        showToast(result.processed + ' asset' + (result.processed === 1 ? '' : 's') + ' moved to CONTESTED under ' + exceptionId + '.' + notice, Boolean(result.failed));
      }).withFailureHandler(function (error) {
        hideWorkflowLoading_();
        submit.disabled = false;
        const info = showAppError_(error, 'Unable to record the contest.');
        setExceptionFlowError_(info.message);
      }).contestAssets({ assetIds: flow.assetIds, exceptionId: exceptionId });
      return;
    }
    const exceptionId = document.getElementById('approvedExceptionId').value.trim().toUpperCase();
    if (!exceptionId) {
      submit.disabled = false;
      setExceptionFlowError_('An approved exception ID is required.');
      document.getElementById('approvedExceptionId').focus();
      return;
    }
    if (!/^EDG-EXC-\d{4}-\d{3,}$/.test(exceptionId)) {
      submit.disabled = false;
      setExceptionFlowError_('Use the approved exception ID format EDG-EXC-2026-009.');
      document.getElementById('approvedExceptionId').focus();
      return;
    }
    setExceptionFlowError_('');
    const loadingToken = beginServerLoading_('Applying approved exception', 'Updating the lifecycle record and exception audit details…');
    google.script.run.withSuccessHandler(function (result) {
      endServerLoading_(loadingToken);
      submit.disabled = false;
      closeExceptionFlow();
      clearBulkSelection();
      loadDashboard(state.page);
      if (flow.assetIds.length === 1) openAsset(flow.assetIds[0]);
      showToast(result.processed + ' asset' + (result.processed === 1 ? '' : 's') + ' marked EXEMPT under ' + exceptionId + '.', Boolean(result.failed));
    }).withFailureHandler(function (error) {
      endServerLoading_(loadingToken);
      submit.disabled = false;
      const info = showAppError_(error, 'Unable to record the approved exception.');
      setExceptionFlowError_(info.message);
    }).markAssetsExempt({
      assetIds: flow.assetIds,
      exceptionId: exceptionId,
      expiresAt: document.getElementById('approvedExceptionExpires').value,
      sourceUrl: document.getElementById('approvedExceptionUrl').value
    });
  }

  function setExceptionFlowError_(message) {
    const error = document.getElementById('exceptionFlowError');
    error.textContent = message ? appErrorInfo_(message, 'Unable to submit the exception request.').message : '';
    error.classList.toggle('hidden', !message);
  }

  function showWorkflowLoading_(title, message, progressConfig) {
    state.manualLoading = true;
    renderWorkflowLoading_(title, message, progressConfig);
  }

  function renderWorkflowLoading_(title, message, progressConfig) {
    document.getElementById('workflowLoadingTitle').textContent = title || 'Processing request';
    document.getElementById('workflowLoadingMessage').textContent = message || 'Updating the lifecycle record and sending the Slack notification…';
    const progress = document.getElementById('workflowLoadingProgress');
    const summary = document.getElementById('workflowLoadingProgressSummary');
    const details = document.getElementById('workflowLoadingDetails');
    const config = normalizeWorkflowProgress_(progressConfig);
    document.getElementById('workflowLoadingDismiss').classList.toggle('hidden', !config.dismissible);
    document.getElementById('workflowLoadingHint').textContent = config.hint || 'Please keep this window open.';

    document.getElementById('workflowLoadingStage').textContent = config.stage || '';
    progress.setAttribute('aria-valuetext', config.stage || message || 'Processing request');

  function normalizeWorkflowProgress_(progressConfig) {
    if (!progressConfig) return { visible: false, indeterminate: false, percent: 0, stage: '', details: [], dismissible: false, hint: '' };
    if (progressConfig === true) return { visible: true, indeterminate: true, percent: 0, stage: 'Processing request', details: [], dismissible: false, hint: '' };
    if (typeof progressConfig === 'number') return { visible: true, indeterminate: false, percent: Math.max(0, Math.min(100, Math.round(progressConfig))), stage: '', details: [], dismissible: false, hint: '' };
    const numericPercent = Number(progressConfig.percent);
    return {
      visible: true,
      indeterminate: Boolean(progressConfig.indeterminate) || !isFinite(numericPercent),
      percent: isFinite(numericPercent) ? Math.max(0, Math.min(100, Math.round(numericPercent))) : 0,
      stage: cleanClientText_(progressConfig.stage),
      details: Array.isArray(progressConfig.details) ? progressConfig.details.filter(function (item) { return item && item.label && item.value !== undefined && item.value !== null && String(item.value) !== ''; }) : [],
      dismissible: Boolean(progressConfig.dismissible),
      hint: cleanClientText_(progressConfig.hint)
    };
  }

  function renderIntakeReviewPreparation_(status) {
    const current = Object.assign({}, state.intakePreparation || {}, status || {});
    state.intakePreparation = current;
    if (state.intakeReviewOverlayDismissed) return;
    const preparationStatus = cleanClientText_(current.status || current.preparationStatus).toUpperCase();
    const queued = preparationStatus === 'QUEUED';
    const merging = preparationStatus === 'MERGING_REVIEW';
    const reconciling = preparationStatus === 'RECONCILING_REVIEW';
    const startedAt = current.startedAt ? new Date(current.startedAt).getTime() : Number(current.clientStartedAt || Date.now());
    const elapsedSeconds = Math.max(0, Math.floor((Date.now() - startedAt) / 1000));
    renderWorkflowLoading_('Preparing intake review', 'The CSV is safely staged. Review preparation is running independently, so you can continue using the application.', {
      indeterminate: false,
      percent: queued ? 2 : ((merging || reconciling) ? 99 : Number(current.percent || 0)),
      stage: queued ? 'Queued for review' : (merging ? 'Assembling the completed review' : (reconciling ? 'Reconciling prior lifecycle records' :
        'Evaluating source rows ' + formatNumber(current.processedRows || 0) + ' of ' + formatNumber(current.totalRows || current.sourceRows || 0))),
      details: [
        { label: 'File', value: current.fileName || '', wide: true },
        { label: 'Source rows staged', value: formatNumber(current.sourceRows || 0) },
        { label: 'Status', value: queued ? 'Queued' : ((merging || reconciling) ? 'Finalizing review' : 'Calculating review') },
        { label: 'Upload size', value: formatFileSize(current.fileSizeBytes || 0) },
        { label: 'Elapsed time', value: formatElapsedTime_(elapsedSeconds) }
      ],
      dismissible: true,
      hint: 'Each completed batch is saved. You can close this window and resume from the latest checkpoint.'
    });
  }

  function handleIntakeReviewPreparationStatus_(status) {
    clearTimeout(state.intakeReviewPoller);
    state.intakeReviewPoller = null;
    const button = document.getElementById('importButton');
    const banner = document.getElementById('statusBanner');
    if (status && status.status === 'READY' && status.review) {
      button.disabled = false;
      state.intakePreparation = null;
      state.intakeReviewOverlayDismissed = false;
      hideWorkflowLoading_();
      banner.classList.add('hidden');
      state.intakeReview = status.review;
      renderIntakeReview(status.review);
      showToast('Intake review prepared successfully.');
      return;
    }
    if (!status || status.status === 'FAILED' || !status.running) {
      failIntakeReviewPreparation_(new Error(status && status.lastError || 'Review preparation did not complete.'));
      return;
    }
    state.intakePreparation = Object.assign({}, state.intakePreparation || {}, status, { running: true });
    renderIntakeReviewPreparation_(status);
    state.intakeReviewPoller = setTimeout(pollIntakeReviewPreparation_, 1500);
  }

  function pollIntakeReviewPreparation_() {
    const pending = state.intakePreparation;
    if (!pending || !pending.token) return;
    google.script.run.withSuccessHandler(handleIntakeReviewPreparationStatus_).withFailureHandler(function (error) {
      failIntakeReviewPreparation_(error);
    }).continueSnowflakeIntakeReview({ token: pending.token });
  }

  function failIntakeReviewPreparation_(error) {
    clearTimeout(state.intakeReviewPoller);
    state.intakeReviewPoller = null;
    const message = error && error.message ? error.message : String(error || 'Review preparation failed.');
    const banner = document.getElementById('statusBanner');
    document.getElementById('importButton').disabled = false;
    state.intakePreparation = null;
    state.intakeReviewOverlayDismissed = false;
    hideWorkflowLoading_();
    banner.classList.remove('hidden');
    banner.classList.add('error');
    banner.textContent = 'The CSV was staged, but review preparation stopped: ' + message + ' Upload the file again to retry; nothing was published.';
    showToast(message, true);
  }

  function startUploadProgress_(file) {
    stopUploadProgress_();
    const startedAt = Date.now();
    const render = function () {
      const elapsedSeconds = Math.max(0, Math.floor((Date.now() - startedAt) / 1000));
      let percent = 8;
      let stage = 'Uploading CSV';
      let message = 'Transferring the selected file securely to the DEV intake workspace…';
      if (elapsedSeconds >= 2) {
        percent = Math.min(34, 18 + elapsedSeconds * 2);
        stage = 'Validating file structure';
        message = 'Checking required columns, data types, and source rows…';
      }
      if (elapsedSeconds >= 7) {
        percent = Math.min(88, 42 + Math.floor((elapsedSeconds - 7) * 1.5));
        stage = 'Calculating lifecycle changes';
        message = 'Comparing the upload with current assets and preparing the intake review…';
      }
      showWorkflowLoading_('Preparing data import', message, {
        percent: percent,
        stage: stage + ' · estimated progress',
        details: [
          { label: 'File', value: file.name, wide: true },
          { label: 'File size', value: formatFileSize(file.size) },
          { label: 'Elapsed time', value: formatElapsedTime_(elapsedSeconds) },
          { label: 'Environment', value: state.config && state.config.environment ? state.config.environment.key : 'DEV' },
          { label: 'Next step', value: 'EDG intake review' }
        ]
      });
    };
    render();
    state.uploadProgressTimer = setInterval(render, 1000);
  }

  function stopUploadProgress_() {
    if (!state.uploadProgressTimer) return;
    clearInterval(state.uploadProgressTimer);
    state.uploadProgressTimer = null;
  }

    state.intakeReviewDismissed = {};
    state.intakeReviewRecords = buildIntakeReviewRecords_(review);

    window.scrollTo(0, 0);

  function buildIntakeReviewRecords_(review) {
    const samples = review.samples || {};
    const definitions = [
      ['initialRestrictions', 'QUARANTINE_PURGE', 'INITIAL_RESTRICTED', 'Initial restricted asset', false],
      ['newCandidates', 'NEW_STALE', 'NEW', 'New record', true, function (item) { return !item.reviewGroup && item.opensNewCase !== false; }],
      ['changedCandidates', 'NEW_STALE', 'CHANGED', 'Changed record', true, function (item) { return !item.reviewGroup && (item.opensNewCase || item.messageType === 'STALE_ASSET_NOTICE'); }],
      ['restrictionTransitions', 'QUARANTINE_PURGE', 'QUARANTINE', 'Quarantine confirmation', false],
      ['reappearances', 'LIFECYCLE', 'REAPPEARED', 'Purged asset reappeared', false],
      ['noLongerCandidates', 'LIFECYCLE', 'RECOVERED', 'No longer stale', false],
      ['missingFromExtract', 'QUARANTINE_PURGE', 'MISSING', 'Purge verification', false, function (item) { return item.purgeVerification || item.messageType === 'PURGE_COMPLETED'; }]
    ];
    const records = [];
    definitions.forEach(function (definition) {
      (samples[definition[0]] || []).forEach(function (item, index) {
        const copy = Object.assign({}, item);
        if (definition[5] && !definition[5](copy)) return;
        copy.reviewStage = typeof definition[1] === 'function' ? definition[1](copy) : definition[1];
        copy.reviewType = definition[2];
        copy.reviewLabel = definition[3];
        copy.dismissible = definition[4] && item.dismissible !== false;
        copy.reviewKey = copy.assetId || definition[0] + '|' + index + '|' + (copy.fqn || 'record');
        records.push(copy);
      });
    });
    return records;
  }

  function renderIntakeReviewMetrics_() {
    const review = state.intakeReview;
    const dismissed = Object.keys(state.intakeReviewDismissed).length;
    const dismissedNotices = dismissedInitialNoticeCount_();
    const dismissedOrphans = state.intakeReviewRecords.filter(function (item) {
      return item.orphanQuarantine && state.intakeReviewDismissed[item.assetId];
    }).length;
    const orphanNotices = Math.max(0, Number(review.orphanStaleAssets || 0) - dismissedOrphans);
    const newlyStale = review.newlyStaleRecords === undefined
      ? Number(review.newCandidates || 0) + Number(review.changedCandidates || 0)
      : Number(review.newlyStaleRecords || 0);
    const existingChanges = review.existingLifecycleChanges === undefined
      ? Number(review.noLongerCandidates || 0)
      : Number(review.existingLifecycleChanges || 0);
    const quarantinePurge = review.quarantinePurgeChanges === undefined
      ? Number(review.initialRestrictedAssets || 0) + Number(review.restrictionTransitions || 0) + Number(review.expectedPurges || 0) + Number(review.expectedSelfPurges || 0)
      : Number(review.quarantinePurgeChanges || 0);
    const metrics = [
      ['Newly stale', newlyStale, 'action', formatNumber(newlyStale) + ' entering or re-entering lifecycle · ' + formatNumber(review.orphanStaleAssets || 0) + ' orphan quarantine handoffs' + (dismissed ? ' · ' + formatNumber(dismissed) + ' dismissed' : '')],
      ['Existing lifecycle changes', existingChanges, 'notice', formatNumber(review.noLongerCandidates) + ' changing to Active'],
      ['Quarantine & purge', quarantinePurge, 'warning', formatNumber(review.initialRestrictedAssets) + ' newly restricted · ' + formatNumber(review.restrictionTransitions) + ' quarantine transitions · ' + formatNumber(Number(review.expectedPurges || 0) + Number(review.expectedSelfPurges || 0)) + ' purge verifications'],
      ['Notifications', Math.max(0, Number(review.notificationAssets || 0) - dismissedNotices) + orphanNotices + Number(review.quarantineNotificationAssets || 0) + Number(review.expectedPurges || 0) + Number(review.restorationNotificationAssets || 0), 'safe', formatNumber(Math.max(0, Number(review.notificationAssets || 0) - dismissedNotices)) + ' immediate owner · ' + formatNumber(orphanNotices) + ' immediate orphan outreach · ' + formatNumber(review.quarantineNotificationAssets) + ' quarantine · ' + formatNumber(review.expectedPurges) + ' purge complete · ' + formatNumber(review.restorationNotificationAssets || 0) + ' restoration'],
      ['Schema owners', Number(review.schemaOwnerMatchedAssets || 0), 'notice', formatNumber(review.schemaOwnerMatchedAssets || 0) + ' assets matched by database.schema · ' + formatNumber(review.schemaOwnerUnmatchedAssets || 0) + ' unmatched']
    ];
    document.getElementById('intakeReviewMetrics').innerHTML = metrics.map(function (item) {
      return '<article class="review-metric ' + item[2] + '"><span>' + escapeHtml(item[0]) + '</span><strong>' + formatNumber(item[1]) + '</strong><small>' + escapeHtml(item[3]) + '</small></article>';
    }).join('');
  }

  function reviewStepTotal_(stepKey) {
    const review = state.intakeReview || {};
    if (stepKey === 'NEW_STALE') return review.newlyStaleRecords === undefined
      ? state.intakeReviewRecords.filter(function (item) { return item.reviewStage === stepKey; }).length
      : Number(review.newlyStaleRecords || 0);
    if (stepKey === 'LIFECYCLE') return review.existingLifecycleChanges === undefined
      ? state.intakeReviewRecords.filter(function (item) { return item.reviewStage === stepKey; }).length
      : Number(review.existingLifecycleChanges || 0);
    if (stepKey === 'QUARANTINE_PURGE') return review.quarantinePurgeChanges === undefined
      ? state.intakeReviewRecords.filter(function (item) { return item.reviewStage === stepKey; }).length
      : Number(review.quarantinePurgeChanges || 0);
    return Number(review.sourceRows || 0);
  }

    }).join('');
