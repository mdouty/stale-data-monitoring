    populateLocalFilter_('intakeReviewTypeFilter', 'All asset types', uniqueValues_(records, 'type'));
  }

  function uniqueValues_(records, field) {
    const seen = {};
    records.forEach(function (item) { const value = item[field] || 'UNASSIGNED'; seen[value] = true; });
    return Object.keys(seen).sort();
  }

  function populateLocalFilter_(id, allLabel, values) {
    const select = document.getElementById(id);
    select.innerHTML = '<option value="">' + escapeHtml(allLabel) + '</option>' + values.map(function (value) { return '<option value="' + escapeHtml(value) + '">' + escapeHtml(value) + '</option>'; }).join('');
  }

  function intakeReviewChangeText_(item) {
    if (item.stalenessSignal && item.stalenessAnchor) {
      const signal = item.stalenessSourceField || (item.stalenessSignal === 'LAST_READ' ? 'LAST_READ' : 'OBJECT_CREATED_DATE');
      const sourceValue = item.stalenessSourceValue || item.stalenessAnchor;
      const days = typeof item.daysInactive === 'number' ? formatNumber(item.daysInactive) + ' days' : String(item.daysInactive || 'Signal gap');
      return signal + ': ' + sourceValue + ' · ' + days + ' · threshold ' + formatNumber(item.staleThresholdDays || 180) + ' days';
    }
    if (item.reviewType === 'NEW') return item.orphanQuarantine ? 'Orphaned stale record → quarantine handoff' : 'New stale record';
    if (item.reviewType === 'CHANGED') {
      const fields = (item.changes || []).map(function (change) { return change.field; });
      const shown = fields.slice(0, 4);
      return 'Updated: ' + shown.join(', ') + (fields.length > shown.length ? ' +' + (fields.length - shown.length) + ' more' : '');
    }
    if (item.reviewType === 'INITIAL_RESTRICTED') return 'New restricted record → Quarantined';
    if (item.reviewType === 'QUARANTINE') return 'Restriction confirmed → Quarantined';
    if (item.reviewType === 'RESTRICTION_CLEARED') return 'Restriction cleared — restoration review required';
    if (item.reviewType === 'RECOVERED') return 'Read detected → Active';
    if (item.reviewType === 'MISSING') return item.messageType === 'PURGE_COMPLETED'
      ? 'Missing after purge handoff → Purged'
      : 'Missing from extract — retained';
    if (item.reviewType === 'SIGNAL_GAP') return 'Read staleness unavailable — existing lifecycle retained';
    return item.changeSummary || 'No lifecycle change';
  }

  function filterIntakeReview() {
    const step = INTAKE_REVIEW_STEPS[state.intakeReviewStep];
    if (!step || step.key === 'PUBLISH') return;
    const search = document.getElementById('intakeReviewSearch').value.trim().toLowerCase();
    const category = document.getElementById('intakeReviewCategoryFilter').value;
    const domain = document.getElementById('intakeReviewDomainFilter').value;
    const type = document.getElementById('intakeReviewTypeFilter').value;
    state.intakeReviewVisibleRecords = state.intakeReviewRecords.filter(function (item) {
      if (item.reviewStage !== step.key) return false;
      if (category && item.reviewLabel !== category) return false;
      if (domain && (item.domain || 'UNASSIGNED') !== domain) return false;
      if (type && (item.type || 'UNASSIGNED') !== type) return false;
      if (!search) return true;
      return [item.fqn, item.type, item.domain, item.reviewLabel, intakeReviewChangeText_(item), item.messageType, item.primaryRecipient].join(' ').toLowerCase().indexOf(search) !== -1;
    });
    renderIntakeReviewRows_();
  }

  function renderIntakeReviewRows_() {
    const records = state.intakeReviewVisibleRecords;
    const body = document.getElementById('intakeReviewRows');
    body.innerHTML = records.length ? records.map(function (item) {
      const dismissed = Boolean(state.intakeReviewDismissed[item.assetId]);
      const selected = Boolean(state.intakeReviewSelection[item.reviewKey]);
      const changeText = intakeReviewChangeText_(item);
      const checkbox = item.dismissible ? '<input class="intake-review-select" type="checkbox" value="' + escapeHtml(item.reviewKey) + '" ' + (selected ? 'checked' : '') + ' aria-label="Select ' + escapeHtml(item.fqn) + '" onchange="toggleIntakeReviewRecord(this.value,this.checked)">' : '';
      const contact = '<div class="review-contact"><strong>' + escapeHtml(item.messageType || 'No notification') + '</strong>' + escapeHtml(item.primaryRecipient || '—') + '</div>';
      const action = item.dismissible ? '<button class="button ' + (dismissed ? 'subtle' : 'dismiss') + '" onclick="setIntakeRecordDismissed(' + JSON.stringify(item.assetId).replace(/"/g, '&quot;') + ',' + (dismissed ? 'false' : 'true') + ')">' + (dismissed ? 'Restore' : 'Dismiss') + '</button>' : '';
      return '<tr class="' + (dismissed ? 'review-row-dismissed' : '') + '"><td class="select-column">' + checkbox + '</td><td class="review-fqn" title="' + escapeHtml(item.fqn) + '">' + escapeHtml(item.fqn) + '</td><td>' + escapeHtml(item.reviewLabel) + '</td><td class="review-change" title="' + escapeHtml(changeText) + '">' + escapeHtml(changeText) + '</td><td>' + contact + '</td><td>' + escapeHtml(item.domain || 'UNASSIGNED') + '</td><td>' + action + '</td></tr>';
    }).join('') : '<tr><td colspan="7" class="empty compact">No records match these filters.</td></tr>';
    const stageKey = INTAKE_REVIEW_STEPS[state.intakeReviewStep].key;
    const total = reviewStepTotal_(stageKey);
    const loaded = state.intakeReviewRecords.filter(function (item) { return item.reviewStage === stageKey; }).length;
    document.getElementById('intakeReviewVisibleCount').textContent = formatNumber(records.length) + ' shown';
    const note = document.getElementById('intakeReviewSampleNote');
    note.classList.toggle('hidden', total <= loaded);
    note.textContent = total > loaded ? 'Showing ' + formatNumber(records.length) + ' matching records from ' + formatNumber(loaded) + ' loaded samples out of ' + formatNumber(total) + ' in this category.' : '';
    updateIntakeReviewSelectionUi_();
  }

  function toggleIntakeReviewRecord(reviewKey, checked) {
    if (checked) state.intakeReviewSelection[reviewKey] = true;
    else delete state.intakeReviewSelection[reviewKey];
    updateIntakeReviewSelectionUi_();
  }

  function toggleAllIntakeReviewRecords(checked) {
    state.intakeReviewVisibleRecords.forEach(function (item) {
      if (!item.dismissible) return;
      if (checked) state.intakeReviewSelection[item.reviewKey] = true;
      else delete state.intakeReviewSelection[item.reviewKey];
    });
    renderIntakeReviewRows_();
  }

  function selectedIntakeReviewRecords_() {
    return state.intakeReviewRecords.filter(function (item) { return state.intakeReviewSelection[item.reviewKey] && item.dismissible; });
  }

  function clearIntakeReviewSelection() {
    state.intakeReviewSelection = {};
    document.querySelectorAll('.intake-review-select').forEach(function (input) { input.checked = false; });
    updateIntakeReviewSelectionUi_();
  }

  function updateIntakeReviewSelectionUi_() {
    const selectedCount = selectedIntakeReviewRecords_().length;
    document.getElementById('intakeReviewBulkBar').classList.toggle('hidden', selectedCount === 0);
    document.getElementById('intakeReviewSelectedCount').textContent = selectedCount;
    const selectable = state.intakeReviewVisibleRecords.filter(function (item) { return item.dismissible; });
    const selectedVisible = selectable.filter(function (item) { return state.intakeReviewSelection[item.reviewKey]; });
    const selectAll = document.getElementById('selectAllIntakeRecords');
    selectAll.disabled = selectable.length === 0;
    selectAll.checked = selectable.length > 0 && selectedVisible.length === selectable.length;
    selectAll.indeterminate = selectedVisible.length > 0 && selectedVisible.length < selectable.length;
  }

  function setIntakeRecordDismissed(assetId, dismissed) {
    if (dismissed) state.intakeReviewDismissed[assetId] = true;
    else delete state.intakeReviewDismissed[assetId];
    renderIntakeReviewMetrics_();
    filterIntakeReview();
  }

  function dismissSelectedIntakeRecords() {
    const records = selectedIntakeReviewRecords_();
    if (!records.length) return;
    showConfirmation({
      title: 'Dismiss selected records',
      message: 'Mark ' + records.length + ' selected record' + (records.length === 1 ? '' : 's') + ' as dismissed?',
      detail: 'Dismissed records remain auditable in the lifecycle dataset, will not receive an initial notice, and will not enter the active deprecation path.',
      confirmLabel: 'Dismiss selected',
      confirmClass: 'dismiss'
    }, function () {
      records.forEach(function (item) { state.intakeReviewDismissed[item.assetId] = true; });
      clearIntakeReviewSelection();
      renderIntakeReviewMetrics_();
      filterIntakeReview();
    });
  }

  function restoreSelectedIntakeRecords() {
    selectedIntakeReviewRecords_().forEach(function (item) { delete state.intakeReviewDismissed[item.assetId]; });
    clearIntakeReviewSelection();
    renderIntakeReviewMetrics_();
    filterIntakeReview();
  }

  function renderIntakeReviewImpact_() {
    const review = state.intakeReview;
    const dismissed = Object.keys(state.intakeReviewDismissed).length;
    const dismissedOrphans = state.intakeReviewRecords.filter(function (item) {
      return item.orphanQuarantine && state.intakeReviewDismissed[item.assetId];
    }).length;
    const orphanHandoffs = Math.max(0, Number(review.orphanStaleAssets || 0) - dismissedOrphans);
    const initialNotices = Math.max(0, Number(review.notificationAssets || 0) - dismissedInitialNoticeCount_());
    const recipientText = initialNotices ? formatNumber(initialNotices) + ' newly opened cases queued for immediate owner notices in approximately ' + formatNumber(review.notificationGroups) + ' consolidated Slack message group' + (Number(review.notificationGroups) === 1 ? '' : 's') : 'No new immediate owner notices';
    const orphanText = orphanHandoffs ? formatNumber(orphanHandoffs) + ' EDG-coordinated orphan outreach notice' + (orphanHandoffs === 1 ? '' : 's') + ' at T0' : 'No orphan outreach notices';
    const quarantineText = review.quarantineNotificationAssets ? formatNumber(review.quarantineNotificationAssets) + ' quarantine confirmations in approximately ' + formatNumber(review.quarantineNotificationGroups) + ' consolidated Slack message group' + (Number(review.quarantineNotificationGroups) === 1 ? '' : 's') : 'No new quarantine confirmations';
    const purgeText = review.expectedPurges ? formatNumber(review.expectedPurges) + ' purge completion' + (Number(review.expectedPurges) === 1 ? '' : 's') : 'No purge completions';
    const selfPurgeText = review.expectedSelfPurges ? formatNumber(review.expectedSelfPurges) + ' self-purge verification' + (Number(review.expectedSelfPurges) === 1 ? '' : 's') + ' with no notification' : 'No self-purge verifications';
    const restorationText = review.restorationNotificationAssets ? formatNumber(review.restorationNotificationAssets) + ' restoration confirmation' + (Number(review.restorationNotificationAssets) === 1 ? '' : 's') : 'No restoration confirmations';
    const totalNotifications = initialNotices + orphanHandoffs + Number(review.quarantineNotificationAssets || 0) + Number(review.expectedPurges || 0) + Number(review.restorationNotificationAssets || 0);
    document.getElementById('intakeReviewImpact').innerHTML = '<div class="review-impact-grid"><div class="review-impact-stat"><strong>' + formatNumber(review.sourceRows) + '</strong><span>source rows evaluated</span></div><div class="review-impact-stat"><strong>' + formatNumber(dismissed) + '</strong><span>candidates dismissed</span></div><div class="review-impact-stat"><strong>' + formatNumber(totalNotifications) + '</strong><span>notification records</span></div></div><p><strong>On confirmation:</strong> the operational dataset will be refreshed, existing lifecycle state will be preserved, ' + formatNumber(orphanHandoffs) + ' orphaned stale asset' + (orphanHandoffs === 1 ? '' : 's') + ' will be accepted and queued for quarantine, ' + formatNumber(review.initialRestrictedAssets) + ' newly observed restricted asset' + (Number(review.initialRestrictedAssets) === 1 ? '' : 's') + ' will enter as QUARANTINED, ' + formatNumber(review.restrictionTransitions) + ' existing asset' + (Number(review.restrictionTransitions) === 1 ? '' : 's') + ' will transition to QUARANTINED, recovered stale assets will become ACTIVE, ' + formatNumber(review.expectedPurges) + ' completed purge handoff' + (Number(review.expectedPurges) === 1 ? '' : 's') + ' and ' + formatNumber(review.expectedSelfPurges || 0) + ' owner self-purge' + (Number(review.expectedSelfPurges || 0) === 1 ? '' : 's') + ' will be verified, and ' + formatNumber(review.restorationNotificationAssets || 0) + ' previously purged asset' + (Number(review.restorationNotificationAssets || 0) === 1 ? '' : 's') + ' will be restored after reappearance.</p><p><strong>Schema-owner enrichment:</strong> ' + formatNumber(review.schemaOwnerMatchedAssets || 0) + ' imported asset' + (Number(review.schemaOwnerMatchedAssets || 0) === 1 ? '' : 's') + ' matched an eligible Confirmed or Assigned - Final database.schema assignment; ' + formatNumber(review.schemaOwnerUnmatchedAssets || 0) + ' did not match. The raw delegate name and username are retained with the derived Salesforce email.</p><p><strong>Dismissals:</strong> ' + formatNumber(dismissed) + ' selected candidate' + (dismissed === 1 ? '' : 's') + ' will publish as DISMISSED, receive no initial notice, and have pending platform actions cancelled.</p><p><strong>Notifications:</strong> ' + escapeHtml(recipientText) + '; ' + escapeHtml(orphanText) + '; ' + escapeHtml(quarantineText) + '; ' + escapeHtml(purgeText) + '; ' + escapeHtml(selfPurgeText) + '; ' + escapeHtml(restorationText) + '. Recipient fallback is Technical Steward → Business Steward → Snowflake Table Owner → Schema Owner → Database Owner → EDG Operations. The exact resolved recipient is shown for every sampled notification above.</p><p><strong>Automatically handled:</strong> ' + formatNumber(review.unchangedCandidates) + ' unchanged candidates retain their current state; ' + formatNumber(review.belowThreshold) + ' active rows remain visible in inventory but outside the stale lifecycle workflow.</p>';
    renderIntakeNotificationPayloads_();
  }

  function exportIntakeReviewDetails() {
    const review = state.intakeReview;
    const button = document.getElementById('exportIntakeReviewButton');
    if (!review || !review.token) {
      showToast('This intake review is no longer available for export.', true);
      return;
    }
    button.disabled = true;
    button.textContent = 'Preparing export…';
    google.script.run.withSuccessHandler(function (exportData) {
      button.disabled = false;
      button.textContent = 'Export review CSV';
      downloadCsvFile_(exportData);
      showToast(formatNumber(exportData.rows.length) + ' review record' + (exportData.rows.length === 1 ? '' : 's') + ' exported.');
    }).withFailureHandler(function (error) {
      button.disabled = false;
      button.textContent = 'Export review CSV';
      showToast(error.message || String(error), true);
    }).exportSnowflakeIntakeReview({
      token: review.token,
      dismissedAssetIds: Object.keys(state.intakeReviewDismissed)
    });
  }

  function renderIntakeNotificationPayloads_() {
    const container = document.getElementById('intakeNotificationPayloads');
    const previews = (state.intakeReview && state.intakeReview.notificationPayloadPreviews || []).map(function (preview) {
      const copy = Object.assign({}, preview);
      copy.assetIds = (preview.assetIds || []).filter(function (assetId) { return !state.intakeReviewDismissed[assetId]; });
      copy.assets = (preview.assets || []).filter(function (asset) { return !state.intakeReviewDismissed[asset.assetId]; });
      copy.assetCount = copy.assetIds.length || Math.max(0, Number(preview.assetCount || 0) - Object.keys(state.intakeReviewDismissed).filter(function (assetId) {
        return (preview.assetIds || []).indexOf(assetId) !== -1;
      }).length);
      return copy;
    }).filter(function (preview) {
      return preview.assetCount > 0;
    });
    if (!previews.length) {
      container.innerHTML = '<div class="review-payload-heading"><div><h3>Slack notification review</h3><span>No Slack notifications are expected from this refresh.</span></div></div>';
      return;
    }
    container.innerHTML = '<div class="review-payload-heading"><div><h3>Slack notification review</h3><span>' + formatNumber(previews.length) + ' consolidated notification' + (previews.length === 1 ? '' : 's') + ', grouped exactly as delivery by notification type and recipient.</span></div></div>' +
      '<div class="review-payload-note">Each card below represents one Slack notification. Dismissed assets are removed from this review. Lists show up to 10 assets, matching the delivered Slack message.</div>' +
      '<div class="review-payload-list">' + previews.map(function (preview, index) {
        const shown = preview.assets.slice(0, 10);
        const roleMap = {};
        preview.assets.forEach(function (asset) { if (asset.recipientRole) roleMap[asset.recipientRole] = true; });
        const roles = Object.keys(roleMap).sort().map(recipientRoleLabel_).join(', ') || recipientRoleLabel_(preview.recipientRole);
        const assetRows = shown.map(function (asset) {
          const activity = (asset.recipientRole ? 'Via ' + recipientRoleLabel_(asset.recipientRole) + ' · ' : '') + (asset.stalenessAnchor ? formatDate(asset.stalenessAnchor) + (asset.daysInactive !== '' ? ' · ' + formatNumber(asset.daysInactive) + ' days' : '') : 'Staleness basis unavailable');
          return '<li><strong>' + escapeHtml(asset.fqn) + '</strong><span>' + escapeHtml(activity) + '</span></li>';
        }).join('');
        const remainder = preview.assetCount > shown.length ? '<p class="review-payload-more">' + formatNumber(preview.assetCount - shown.length) + ' additional asset' + (preview.assetCount - shown.length === 1 ? '' : 's') + ' will be included. Open the application to view all assets.</p>' : '';
        return '<article class="review-payload-card"><div class="review-payload-card-heading"><div><span class="review-payload-type">' + escapeHtml(preview.messageType) + '</span><h4>' + escapeHtml(preview.recipient) + '</h4><small>Recipient role: ' + escapeHtml(roles) + '</small></div><span class="badge gray">' + formatNumber(preview.assetCount) + ' assets</span></div><ol class="review-payload-assets">' + assetRows + '</ol>' + remainder + '</article>';
      }).join('') + '</div>';
  }

  function recipientRoleLabel_(role) {
    const labels = {
      TECHNICAL_STEWARD: 'Technical Steward', BUSINESS_STEWARD: 'Business Steward',
      SNOWFLAKE_TABLE_OWNER: 'Snowflake Table Owner', SCHEMA_OWNER: 'Schema Owner',
      DATABASE_OWNER: 'Database Owner', EDG_OPERATIONS_RECIPIENT: 'EDG Operations',
      DEV_PRIMARY_RECIPIENT_LOCK: 'DEV Recipient Lock'
    };
    return labels[role] || String(role || 'Unresolved').replace(/_/g, ' ');
  }

  function dismissedInitialNoticeCount_() {
    const counted = {};
    state.intakeReviewRecords.forEach(function (item) {
      if (state.intakeReviewDismissed[item.assetId] && item.messageType === 'STALE_ASSET_NOTICE') counted[item.assetId] = true;
    });
    return Object.keys(counted).length;
  }

  function closeIntakeReview() {
    document.getElementById('intakeReviewPage').classList.add('hidden');
    document.getElementById('intakeReviewPage').setAttribute('aria-hidden', 'true');
    document.body.classList.remove('review-open');
  }

  function cancelIntakeReview() {
    const review = state.intakeReview;
    if (!review) { closeIntakeReview(); return; }
    document.getElementById('confirmIntakeButton').disabled = true;
    const loadingToken = beginServerLoading_('Cancelling intake review', 'Discarding the staged upload without changing the current dataset…');
    google.script.run.withSuccessHandler(function () {
      endServerLoading_(loadingToken);
      state.intakeReview = null;
      state.intakeReviewRecords = [];
      state.intakeReviewSelection = {};
      state.intakeReviewDismissed = {};
      document.getElementById('confirmIntakeButton').disabled = false;
      closeIntakeReview();
      showToast('Staged intake discarded. The current dataset was not changed.');
    }).withFailureHandler(function (error) {
      endServerLoading_(loadingToken);
      document.getElementById('confirmIntakeButton').disabled = false;
      showToast(error.message || String(error), true);
    }).discardSnowflakeIntake(review.token);
  }

  function confirmIntakeReview() {
    const review = state.intakeReview;
    if (!review) return;
    const button = document.getElementById('confirmIntakeButton');
    state.publicationOverlayDismissed = false;
    button.disabled = true;
    button.textContent = 'Publishing…';
    showPublishingLoading_({ phase: 'STARTING', completed: 0, total: review.sourceRows, percent: 0 });
    const dismissedAssetIds = Object.keys(state.intakeReviewDismissed);
    google.script.run.withSuccessHandler(function (status) {
      state.intakeReview = null;
      state.intakeReviewRecords = [];
      state.intakeReviewSelection = {};
      state.intakeReviewDismissed = {};
      button.disabled = false;
      button.textContent = 'Confirm & Publish';
      closeIntakeReview();
      renderImportStatus(status);
      if (status.running) {
        showPublishingLoading_(status);
        startPolling(true);
      } else {
        hideWorkflowLoading_();
        loadDashboard(1);
        showToast('EDG review published successfully.');
      }
    }).withFailureHandler(function (error) {
      button.disabled = false;
      button.textContent = 'Confirm & Publish';
      hideWorkflowLoading_();
      showToast(error.message || String(error), true);
    }).confirmSnowflakeIntake({ token: review.token, dismissedAssetIds: dismissedAssetIds });
  }

  function showPublishingLoading_(status) {
    const current = status || {};
    const phase = cleanClientText_(current.phase || 'STARTING').toUpperCase();
    const rowPercent = Math.max(0, Math.min(100, Number(current.percent || 0)));
    const progressStage = cleanClientText_(current.progressStage).toUpperCase();
    const progressLabels = {
      QUEUED_FOR_SOURCE_EVALUATION: 'Queued for source evaluation',
      QUEUED_FOR_NEXT_SOURCE_BATCH: 'Source checkpoint saved; next batch queued',
      PROCESSING_SOURCE_BATCH: 'Processing the next source batch',
      SOURCE_EVALUATION_COMPLETE: 'Source evaluation complete',
      PUBLISHING_ASSET_BUFFER: 'Publishing evaluated asset data',
      RECONCILING_LIFECYCLE: 'Reconciling lifecycle records',
      APPROVING_CANDIDATES: 'Applying reviewed decisions',
      APPLYING_LIFECYCLE_CHANGES: 'Applying lifecycle changes',
      REFRESHING_DASHBOARD: 'Refreshing dashboard data',
      QUEUING_NOTIFICATIONS: 'Queueing background Slack delivery',
      SENDING_NOTIFICATIONS: 'Sending consolidated Slack notifications',
      COMPLETING_PUBLICATION: 'Completing publication'
    };
    let indeterminate = true;
    let displayedPercent = 0;
    let stage = 'Submitting approved review';
    if (phase === 'IMPORT') {
      displayedPercent = rowPercent;
      indeterminate = ['QUEUED_FOR_SOURCE_EVALUATION', 'PROCESSING_SOURCE_BATCH'].indexOf(progressStage) !== -1;
      stage = (progressLabels[progressStage] || 'Evaluating source rows') +
        (indeterminate ? ' · ' + formatNumber(current.completed || 0) + ' rows completed' : ' · ' + Math.round(rowPercent) + '% complete');
    } else if (phase === 'PREPARE_FINALIZE' || phase === 'FINALIZE') {
      stage = progressLabels[progressStage] || 'Finalizing lifecycle and notifications';
      displayedPercent = {
        SOURCE_EVALUATION_COMPLETE: 84,
        PUBLISHING_ASSET_BUFFER: 88,
        APPROVING_CANDIDATES: 91,
        RECONCILING_LIFECYCLE: 93,
        APPLYING_LIFECYCLE_CHANGES: 95,
        REFRESHING_DASHBOARD: 97,
        QUEUING_NOTIFICATIONS: 98,
        SENDING_NOTIFICATIONS: 98,
        COMPLETING_PUBLICATION: 99
      }[progressStage] || 85;
      indeterminate = false;
    }
    const processedRows = Number(current.processedRows !== undefined ? current.processedRows : current.completed || 0);
    const totalRows = Number(current.total || 0);
    const elapsedSeconds = current.startedAt ? Math.max(0, Math.floor((Date.now() - new Date(current.startedAt).getTime()) / 1000)) : 0;
    const detailRows = [
      { label: 'File', value: current.fileName || (state.intakeReview && state.intakeReview.fileName) || '', wide: true },
      { label: 'Rows processed', value: formatNumber(processedRows) + (totalRows ? ' of ' + formatNumber(totalRows) : '') },
      { label: 'Published assets', value: formatNumber(current.writtenRows !== undefined ? current.writtenRows : current.candidates || 0) },
      { label: 'Row errors', value: formatNumber(current.errors || 0) },
      { label: 'Elapsed time', value: formatElapsedTime_(elapsedSeconds) }
    ];
    showWorkflowLoading_(
      'Publishing data refresh',
      current.message || 'Publishing reviewed data and completing lifecycle automation…',
      {
        indeterminate: indeterminate, percent: displayedPercent, stage: stage, details: detailRows,
        dismissible: true,
        hint: 'Each completed checkpoint is saved. Closing this window will not lose progress; reopening the app resumes processing.'
      }
    );
  }

  function formatElapsedTime_(seconds) {
    const total = Math.max(0, Math.floor(Number(seconds || 0)));
    if (total < 60) return total + ' sec';
    const minutes = Math.floor(total / 60);
    const remainder = total % 60;
    return minutes + ' min ' + String(remainder).padStart(2, '0') + ' sec';
  }

  function cleanClientText_(value) {
    return String(value === null || value === undefined ? '' : value).trim();
  }

  function startPolling(showOverlay) {
    clearTimeout(state.poller);
    let publicationCompleted = !showOverlay;
    const poll = function () {
      google.script.run.withSuccessHandler(function (status) {
        renderImportStatus(status);
        if (status.running) {
          if (showOverlay && !state.publicationOverlayDismissed) showPublishingLoading_(status);
          state.poller = setTimeout(poll, state.publicationOverlayDismissed ? 5000 : 1500);
          return;
        }
        const campaignRunning = Boolean(status.notificationCampaign && status.notificationCampaign.running);
        if (!publicationCompleted) {
          publicationCompleted = true;
          state.publicationOverlayDismissed = false;
          document.getElementById('importButton').disabled = false;
          if (showOverlay) hideWorkflowLoading_();
          showOverlay = false;
          loadDashboard(1);
          showToast(status.phase === 'FAILED'
            ? 'Data publication failed. Review the latest job details.'
            : campaignRunning ? 'Data refresh published. Slack delivery is continuing in the background.' : 'Data refresh published successfully.', status.phase === 'FAILED');
        }
        if (campaignRunning) {
          state.poller = setTimeout(poll, 2000);
          return;
        }
        clearTimeout(state.poller);
        state.poller = null;
        renderImportStatus(status);
      }).withFailureHandler(function (error) {
        clearTimeout(state.poller);
        state.poller = null;
        if (showOverlay) hideWorkflowLoading_();
        showToast(error.message || String(error), true);
      }).advanceActiveImportWorkflow();
    };
    state.poller = setTimeout(poll, 2500);
  }

  function renderImportStatus(status) {
    const banner = document.getElementById('statusBanner');
    if (banner.classList.contains('app-error') && status.running) clearAppErrorBanner_();
    if (state.config) state.config.importStatus = status;
    renderAdminImportSummary(status);
    const campaign = status.notificationCampaign || {};
    const publicationPhase = cleanClientText_(status.phase).toUpperCase();
    if (!status.running && publicationPhase === 'FAILED') {
      banner.classList.remove('hidden');
      banner.classList.add('error', 'app-error');
      banner.innerHTML = '<div class="app-error-copy"><strong>Publication finalization needs attention</strong><span>' +
        escapeHtml(status.message || 'The latest publication checkpoint failed.') + '</span></div>' +
        (status.recoverable
          ? '<div class="app-error-actions"><button class="button secondary" type="button" onclick="resumeStalledPublication_()">Resume from saved checkpoint</button></div>'
          : '');
      document.getElementById('importButton').disabled = Boolean(status.recoverable);
      return;
    }
    if (!status.running && campaign.running && campaign.stalled) {
      banner.classList.remove('hidden', 'app-error');
      banner.classList.add('error');
      banner.innerHTML = '<span>Data is published, but Slack preparation stopped at ' +
        formatNumber(campaign.completed || 0) + ' of ' + formatNumber(campaign.total || 0) +
        ' assets. Existing drafts are safe and will not be duplicated.</span> ' +
        '<button class="button secondary" type="button" onclick="resumeStalledNotificationCampaign_()">Resume Slack preparation</button>';
      document.getElementById('importButton').disabled = true;
      return;
    }
    if (!status.running && campaign.running) {
      banner.classList.remove('hidden', 'error', 'app-error');
      const campaignPhase = cleanClientText_(campaign.phase).toUpperCase();
      const campaignText = campaignPhase === 'DRAFTING'
        ? 'Data is published. Preparing one consolidated Slack message per owner: ' +
          formatNumber(campaign.completed || 0) + ' of ' + formatNumber(campaign.total || 0) + ' assets staged.'
        : 'Data is published. Sending one consolidated Slack message per owner: ' +
          formatNumber(campaign.ownerMessagesDelivered || 0) + ' of ' + formatNumber(campaign.ownerMessagesTotal || 0) +
          ' owner messages completed, covering ' + formatNumber(campaign.delivered || 0) + ' assets' +
          (campaign.failed ? ', ' + formatNumber(campaign.failed) + ' needing attention' : '') + '.';
      if (cleanClientText_(campaign.status).toUpperCase() === 'RETRYING') {
        banner.innerHTML = '<span>' + escapeHtml(campaignText) + '</span> ' +
          '<button class="button secondary" type="button" onclick="resumeStalledNotificationCampaign_()">Run next Slack checkpoint now</button>';
      } else {
        banner.textContent = campaignText;
      }
      document.getElementById('importButton').disabled = true;
      return;
    }
    if (!status.running && ['PAUSED', 'COMPLETED_WITH_ERRORS'].indexOf(cleanClientText_(campaign.status).toUpperCase()) !== -1) {
      const slackEnabled = Boolean(state.config && state.config.integrations && state.config.integrations.slack && state.config.integrations.slack.enabled);
      banner.classList.remove('hidden', 'app-error');
      banner.classList.add('error');
      banner.innerHTML = '<span>Data is published. Slack delivery is ' + (campaign.status === 'PAUSED' ? 'paused' : 'complete with errors') + ': ' +
        formatNumber(campaign.completed || 0) + ' of ' + formatNumber(campaign.total || 0) + ' processed, ' +
        formatNumber(campaign.delivered || 0) + ' delivered, ' + formatNumber(campaign.failed || 0) + ' needing attention.</span>' +
        (slackEnabled ? ' <button class="button secondary" type="button" onclick="resumeStalledNotificationCampaign_()">Resume from saved checkpoint</button>' : ' <span>Enable Slack notifications after correcting the workflow payload to retry.</span>');
      document.getElementById('importButton').disabled = true;
      return;
    }
    if (!status.running) {
      banner.classList.add('hidden');
      banner.classList.remove('error');
      document.getElementById('importButton').disabled = false;
      return;
    }
    banner.classList.remove('hidden');
    banner.classList.toggle('error', Boolean(status.stalled));
    const phase = publicationPhase;
    const statusText = phase === 'IMPORT'
      ? 'Intake evaluating source rows: ' + formatNumber(status.completed) + ' / ' + formatNumber(status.total) + ' (' + status.percent + '%). ' + (status.message || '')
      : phase === 'PREPARE_FINALIZE' || phase === 'FINALIZE'
        ? 'Intake finalizing: all ' + formatNumber(status.total) + ' source rows evaluated. ' + (status.message || '')
        : 'Intake publication is starting. ' + (status.message || '');
    if (status.stalled) {
      banner.innerHTML = '<div class="app-error-copy"><strong>Publication appears stalled</strong><span>' +
        escapeHtml(statusText) + '</span></div><div class="app-error-actions"><button class="button secondary" type="button" onclick="resumeStalledPublication_()">Resume from checkpoint</button>' +
        '<button class="button subtle" type="button" onclick="cancelStalledPublication_()">Clear stalled state</button></div>';
      banner.classList.add('app-error');
    } else {
      banner.classList.remove('app-error');
      banner.textContent = statusText;
    }
  }

  function retryImportNotificationCampaign_() {
    confirmAction({
      title: 'Retry Slack delivery',
      message: 'Retry failed and unprocessed notification candidates without republishing asset data?',
      detail: 'Already-sent notification records are idempotent and will not be duplicated.',
      confirmLabel: 'Retry delivery'
    }, function () {
      const loadingToken = beginServerLoading_('Restarting Slack delivery', 'Queueing failed and unprocessed notification candidates…', true);
      google.script.run.withSuccessHandler(function (status) {
        endServerLoading_(loadingToken);
        showToast('Slack delivery retry queued.');
        renderImportStatus({ running: false, notificationCampaign: status });
        startPolling(false);
      }).withFailureHandler(function (error) {
        endServerLoading_(loadingToken);
        showToast(error.message || String(error), true);
      }).retryImportNotificationCampaign();
    });
  }

  function resumeStalledNotificationCampaign_() {
    const loadingToken = beginServerLoading_('Resuming Slack preparation', 'Continuing from the latest saved notification checkpoint…', true);
    google.script.run.withSuccessHandler(function (campaign) {
      endServerLoading_(loadingToken);
      showToast('Slack preparation resumed from the saved checkpoint.');
      renderImportStatus({ running: false, notificationCampaign: campaign });
      startPolling(false);
    }).withFailureHandler(function (error) {
      endServerLoading_(loadingToken);
      showToast(error.message || String(error), true);
    }).resumeStalledImportNotificationCampaign();
  }

  function resumeStalledPublication_() {
    const loadingToken = beginServerLoading_('Resuming publication', 'Restarting from the latest completed checkpoint…', true);
    google.script.run.withSuccessHandler(function (status) {
      endServerLoading_(loadingToken);
      renderImportStatus(status);
      showToast('Publication continuation queued from the latest checkpoint.');
      startPolling(false);
    }).withFailureHandler(function (error) {
      endServerLoading_(loadingToken);
      showToast(error.message || String(error), true);
    }).resumeSnowflakeImport();
  }

  function cancelStalledPublication_() {
    showConfirmation({
      title: 'Clear stalled publication',
      message: 'Stop the stalled publication state and return control to the application?',
      detail: 'Already published asset data will remain in place. Unfinished Slack notifications will not be retried automatically.',
      confirmLabel: 'Clear stalled state',
      confirmClass: 'danger',
      iconClass: 'red'
    }, function () {
      const loadingToken = beginServerLoading_('Clearing stalled publication', 'Stopping continuation triggers and clearing the stale job state…', true);
      google.script.run.withSuccessHandler(function (status) {
        endServerLoading_(loadingToken);
        clearTimeout(state.poller);
        state.poller = null;
        state.publicationOverlayDismissed = false;
        hideWorkflowLoading_();
        renderImportStatus(status);
        loadDashboard(1);
        showToast('The stalled publication state was cleared. Published asset data was retained.');
      }).withFailureHandler(function (error) {
        endServerLoading_(loadingToken);
        showToast(error.message || String(error), true);
      }).cancelSnowflakeImport();
    });
  }

  function saveSettings() {
    const payload = {
      slackWorkflowWebhook: document.getElementById('slackWorkflowWebhook').value,
      snowflakeActionEndpoint: document.getElementById('snowflakeEndpoint').value,
      data360ActionEndpoint: document.getElementById('data360Endpoint').value
    };
    runServer('saveIntegrationSettings', payload, function (integrations) {
      state.config.integrations = integrations;
      renderIntegrations(integrations); hydrateSettings(integrations);
      loadAdminOperations();
      ['slackWorkflowWebhook', 'snowflakeEndpoint', 'data360Endpoint'].forEach(function (id) { document.getElementById(id).value = ''; });
      showToast('Integration settings saved.');
    });
  }

  function badge(value) { const v = String(value || 'UNKNOWN'); const color = /COVERED|KNOWN|READY|EXEMPT|DISMISSED|ACTIVE|RESTORED/.test(v) ? 'green' : /STALE|DETECTED|PENDING|CONFIGURED|DRAFT|ORPHANED|CONTESTED/.test(v) ? 'amber' : /PURGE|PURGED|BLOCKED|FAILED|NO_SLACK/.test(v) ? 'red' : /NOTIFIED|ACCEPTED|QUARANTINED|RESTRICTED/.test(v) ? 'blue' : 'gray'; return '<span class="badge ' + color + '">' + escapeHtml(v) + '</span>'; }
  function mainTableLifecycleBadge_(value) { const v = String(value || 'UNKNOWN'); return v === 'ACCEPTED' ? '<span class="badge green">ACCEPTED</span>' : badge(v); }
  function dashboardStatusDescription_(type, value) {
    const status = String(value || 'UNKNOWN').toUpperCase();
    const assetDescriptions = {
      STALE: 'No qualifying read exists inside the configured threshold.',
      ACTIVE: 'Recent qualifying read activity is present.',
      QUARANTINED: 'Platform access is restricted but recoverable.',
      PURGED: 'Deletion was verified in a complete import.',
      UNKNOWN: 'The current source condition is unavailable.'
    };
    const lifecycleDescriptions = {
      DETECTED: 'Newly identified and awaiting notification.',
      NOTIFIED: 'Owner notified; awaiting a response.',
      CONTESTED: 'Exception submitted and under review.',
      ACCEPTED: 'Deprecation confirmed; quarantine handoff is pending or underway.',
      EXEMPT: 'An approved exception pauses deprecation.',
      EXEMPTED: 'An approved exception pauses deprecation.',
      DISMISSED: 'Removed from the active deprecation workflow.',
      QUARANTINED: 'Restriction verified; the quarantine period is underway.',
      PURGE_ELIGIBLE: 'Quarantine complete; purge review is available.',
      SELF_PURGE_PENDING: 'Owner will delete it; awaiting absence verification.',
      RESTORED: 'Access or lifecycle status was restored.',
      PURGED: 'Absence verified and the lifecycle case is complete.',
      ACTIVE: 'Previously managed asset now has qualifying read activity.',
      EXCLUDED: 'Policy excludes this record from lifecycle action.',
      UNKNOWN: 'The lifecycle position is unavailable.'
    };
    return (type === 'ASSET' ? assetDescriptions : lifecycleDescriptions)[status] || 'Review the asset details for the current meaning.';
  }
  function classificationFor(assetStatus) { if (assetStatus === 'STALE') return { label: 'STALE ASSET', style: 'action' }; if (assetStatus === 'PURGED') return { label: 'PURGE VERIFIED', style: 'excluded' }; if (assetStatus === 'QUARANTINED') return { label: 'QUARANTINED ASSET', style: 'excluded' }; return { label: 'ACTIVE LIFECYCLE ASSET', style: 'safe' }; }
  function formatFileSize(value) { const bytes = Number(value || 0); if (bytes < 1024) return bytes + ' B'; if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB'; return (bytes / 1048576).toFixed(1) + ' MB'; }
  function formatNumber(value) { return new Intl.NumberFormat('en-US', { maximumFractionDigits: 2 }).format(Number(value || 0)); }
  function formatDate(value) { if (!value) return '—'; const date = new Date(value); return isNaN(date.getTime()) ? String(value) : date.toLocaleString([], { year: 'numeric', month: 'short', day: 'numeric' }); }
  function escapeHtml(value) { return String(value === null || value === undefined ? '' : value).replace(/[&<>"]/g, function (char) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[char]; }); }

  function rawAppErrorMessage_(error) {
    if (error && error.message) return String(error.message).trim();
    if (typeof error === 'string') return error.trim();
    try {
      const serialized = JSON.stringify(error);
      if (serialized && serialized !== '{}') return serialized;
    } catch (ignored) {}
    return String(error || '').trim();
  }

  function appErrorInfo_(error, fallback) {
    const raw = rawAppErrorMessage_(error);
    const value = raw.toLowerCase();
    if (/\b401\b|unauthori[sz]ed|not authenticated|login required|authorization required/.test(value)) {
      return {
        title: 'Session expired or account not authorized',
        message: 'Refresh the application and sign in with your Salesforce Google account. Your attempted action was not completed.',
        isAuth: true,
        isTransport: true
      };
    }
    if (/\b403\b|access denied|permission denied|does not have permission|insufficient permission/.test(value)) {
      return {
        title: 'Access denied',
        message: 'Your account does not have permission to perform this action. Confirm that you are using the expected Salesforce account or contact an application administrator.',
        isAuth: false,
        isTransport: false
      };
    }
    if (/network|failed to fetch|could not connect|connection|offline|status 0/.test(value)) {
      return {
        title: 'Application temporarily unreachable',
        message: 'The application could not reach the Google Apps Script service. Check your connection, then try again. Refresh the application if the problem continues.',
        isAuth: false,
        isTransport: true
      };
    }
    if (/timed out|timeout|deadline exceeded|service invoked too many times|quota/.test(value)) {
      return {
        title: 'Request could not finish',
        message: 'The service is temporarily busy or the request took too long. No completion was confirmed; wait briefly and try again.',
        isAuth: false,
        isTransport: true
      };
    }
    return {
      title: 'Request could not be completed',
      message: raw || fallback || 'An unexpected error occurred. Try again, and contact an application administrator if the problem continues.',
      isAuth: false,
      isTransport: false
    };
  }

  function showAppError_(error, fallback) {
    const info = appErrorInfo_(error, fallback);
    displayToast_(info.message, true, info.isTransport ? 9000 : 6000);
    if (info.isTransport) showAppErrorBanner_(info);
    return info;
  }

  function showAppErrorBanner_(info) {
    const banner = document.getElementById('statusBanner');
    banner.classList.remove('hidden');
    banner.classList.add('error', 'app-error');
    banner.innerHTML = '<div class="app-error-copy"><strong>' + escapeHtml(info.title) + '</strong><span>' + escapeHtml(info.message) + '</span></div><div class="app-error-actions"><button class="button subtle" type="button" onclick="refreshApplication_()">' + (info.isAuth ? 'Refresh & sign in' : 'Reload application') + '</button></div>';
  }

  function clearAppErrorBanner_() {
    const banner = document.getElementById('statusBanner');
    if (!banner.classList.contains('app-error')) return;
    banner.classList.add('hidden');
    banner.classList.remove('error', 'app-error');
    banner.textContent = '';
  }

  function refreshApplication_() {
    showWorkflowLoading_('Reloading application', 'Refreshing the page and reconnecting to the application…');
    window.location.reload();
  }

  function displayToast_(message, isError, duration) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.style.background = isError ? '#b42318' : '#12344d';
    toast.classList.remove('hidden');
    setTimeout(function () { toast.classList.add('hidden'); }, duration || 4500);
  }

  function showToast(message, isError) {
    if (isError) { showAppError_(message); return; }
    displayToast_(message, false, 4500);
  }
</script>
