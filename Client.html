<script>
  const state = { config: null, page: 1, pages: 1, timer: null, poller: null, intakeReviewPoller: null, intakePreparation: null, intakeReviewOverlayDismissed: false, uploadProgressTimer: null, detailRequestId: 0, dashboardRequestId: 0, loadingRequestId: 0, loadingRequests: {}, manualLoading: false, publicationOverlayDismissed: false, currentAssets: [], selectedAssets: {}, pendingAssetId: '', confirmationAction: null, adminStatusFlow: null, intakeReview: null, intakeReviewStep: 0, intakeReviewCompletedStep: 0, intakeReviewRecords: [], intakeReviewVisibleRecords: [], intakeReviewSelection: {}, intakeReviewDismissed: {}, purgeReview: null, purgeReviewTimer: null, exceptionFlow: null, myTeam: null, adminTeams: [], userGuideInitialized: false, userGuideDismissed: false, currentPage: 'LANDSCAPE', currentAdminSection: 'OPERATIONS', openDashboardFilter: '', dashboardFilters: { assetStatus: ['STALE'], lifecycle: [], assetType: [], environment: [], stewardship: [], domain: [] }, pendingDashboardFilters: null, dashboardFilterOptions: {} };

  const INTAKE_REVIEW_STEPS = [
    { key: 'NEW_STALE', title: 'Newly stale', description: 'Review records entering or re-entering the stale lifecycle. Dismissals are recorded when the refresh is published.' },
    { key: 'LIFECYCLE', title: 'Existing lifecycle changes', description: 'Review existing records whose lifecycle status will change when the refresh is published.' },
    { key: 'QUARANTINE_PURGE', title: 'Quarantine & purge', description: 'Review newly restricted records, quarantine transitions, and purge-verification outcomes.' },
    { key: 'PUBLISH', title: 'Publish', description: 'Confirm the final population, dismissal decisions, and notification impact.' }
  ];

  document.addEventListener('DOMContentLoaded', boot);
  window.addEventListener('error', function (event) {
    const message = event && (event.error || event.message);
    if (!message || /ResizeObserver loop/i.test(String(event.message || ''))) return;
    showAppError_(message, 'An unexpected browser error occurred.');
  });
  window.addEventListener('unhandledrejection', function (event) {
    showAppError_(event && event.reason, 'An unexpected request error occurred.');
  });
  document.addEventListener('click', function () {
    if (!state.openDashboardFilter) return;
    state.openDashboardFilter = '';
    state.pendingDashboardFilters = null;
    renderDashboardFilters_(state.dashboardFilterOptions);
  });

  function boot() {
    const deepLink = window.__APP_DEEP_LINK__ || {};
    state.pendingAssetId = deepLink.assetId || '';
    renderDashboardFilters_({
      assetStatuses: ['STALE', 'ACTIVE', 'QUARANTINED', 'PURGED'],
      lifecycleStatuses: dashboardLifecycleStatuses_(),
      assetTypes: [],
      environments: ['PRODUCTION', 'SANDBOX', 'DEVELOPMENT', 'NON_PRODUCTION'],
      stewards: [],
      domains: []
    });
    if (deepLink.environment === 'DEV' || deepLink.environment === 'PRD') {
      runServer('setActiveEnvironment', deepLink.environment, applyClientConfig);
    } else {
      runServer('getClientConfig', null, applyClientConfig);
    }
  }

  function applyClientConfig(config) {
    state.config = config;
    if (!state.userGuideInitialized) {
      state.userGuideInitialized = true;
      state.userGuideDismissed = Boolean(config.user.userGuideDismissed);
      if (!state.userGuideDismissed) window.setTimeout(function () { openUserGuide_(false); }, 0);
    }
    state.page = 1;
    document.getElementById('appName').textContent = config.appName;
    document.getElementById('userBadge').textContent = (config.user.email || 'User') + ' · ' + config.user.role + ' · ' + config.environment.key;
    renderEnvironment(config.environment, config.environments);
    const canImport = !config.environment.readOnly && config.environment.importEnabled && config.user.isAdmin;
    const canRunManualAutomation = canImport && config.environment.key !== 'PRD';
    document.getElementById('importButton').classList.toggle('hidden', !canImport);
    document.getElementById('runAutomationButton').classList.toggle('hidden', !canRunManualAutomation);
    document.getElementById('importButton').textContent = 'Import & Refresh Data';
    document.getElementById('adminTab').classList.toggle('hidden', !config.user.isAdmin);
    document.getElementById('adminPanel').classList.toggle('hidden', !config.user.isAdmin);
    if (!config.user.isAdmin && state.currentPage === 'ADMIN') state.currentPage = 'LANDSCAPE';
    showAppPage(state.currentPage);
    renderIntegrations(config.integrations);
    hydrateSettings(config.integrations);
    renderImportStatus(config.importStatus);
    renderAdminImportSummary(config.importStatus);
    loadDashboard(1);
    if (config.importStatus.running) {
      showPublishingLoading_(config.importStatus);
      startPolling(true);
    } else if (config.importStatus.notificationCampaign && config.importStatus.notificationCampaign.running) {
      startPolling(false);
    } else {
      state.publicationOverlayDismissed = false;
    }
  }

  function openUserGuide_(manualOpen) {
    const modal = document.getElementById('userGuideModal');
    document.getElementById('userGuideDontShow').checked = Boolean(state.userGuideDismissed);
    modal.dataset.manualOpen = manualOpen ? 'true' : 'false';
    modal.classList.remove('hidden');
    document.body.classList.add('guide-open');
    window.setTimeout(function () { document.querySelector('#userGuideModal .user-guide-dialog').focus(); }, 0);
  }

  function closeUserGuide_() {
    const modal = document.getElementById('userGuideModal');
    const dontShowAgain = document.getElementById('userGuideDontShow').checked;
    state.userGuideDismissed = dontShowAgain;
    modal.classList.add('hidden');
    document.body.classList.remove('guide-open');
    google.script.run.withSuccessHandler(function (result) {
      state.userGuideDismissed = Boolean(result.dontShowAgain);
      if (state.config && state.config.user) state.config.user.userGuideDismissed = state.userGuideDismissed;
    }).withFailureHandler(function (error) {
      showAppError_(error, 'The application guide preference could not be saved.');
    }).setUserGuidePreference({ dontShowAgain: dontShowAgain });
  }

  function renderEnvironment(environment, environments) {
    const available = {};
    (environments || []).forEach(function (item) { available[item.key] = true; });
    ['DEV', 'PRD'].forEach(function (key) {
      const tab = document.getElementById('environmentTab' + key);
      tab.classList.toggle('hidden', !available[key]);
      tab.classList.toggle('active', key === environment.key);
      tab.classList.toggle('production', key === 'PRD');
      tab.setAttribute('aria-selected', key === environment.key ? 'true' : 'false');
    });
    const safety = environment.readOnly ? ' · Imports, lifecycle changes, notifications, and partner actions are locked.' : environment.recipientLock ? ' · Slack recipient locked to ' + environment.recipientLock + '.' : environment.recipientAllowlist && environment.recipientAllowlist.length ? ' · Slack recipients limited to ' + environment.recipientAllowlist.join(' and ') + '.' : '';
    document.getElementById('environmentDescription').textContent = environment.description + safety;
  }

  function showAppPage(page) {
    const requested = page === 'ADMIN' && state.config && state.config.user.isAdmin ? 'ADMIN' : page === 'TEAM' ? 'TEAM' : 'LANDSCAPE';
    const changedPage = state.currentPage !== requested;
    state.currentPage = requested;
    document.getElementById('landscapePage').classList.toggle('hidden', requested !== 'LANDSCAPE');
    document.getElementById('teamPage').classList.toggle('hidden', requested !== 'TEAM');
    document.getElementById('adminPage').classList.toggle('hidden', requested !== 'ADMIN');
    [['landscapeTab', 'LANDSCAPE'], ['teamTab', 'TEAM'], ['adminTab', 'ADMIN']].forEach(function (item) {
      const tab = document.getElementById(item[0]);
      tab.classList.toggle('primary', requested === item[1]);
      tab.classList.toggle('subtle', requested !== item[1]);
    });
    if (requested === 'ADMIN') showAdminSection(state.currentAdminSection);
    else if (requested === 'TEAM') loadMyTeam_();
    else if (changedPage && state.config) loadDashboard(1);
  }

  function showAdminSection(section) {
    const selected = ['SETTINGS', 'TEAMS'].indexOf(section) !== -1 ? section : 'OPERATIONS';
    state.currentAdminSection = selected;
    document.getElementById('adminOperationsSection').classList.toggle('hidden', selected !== 'OPERATIONS');
    document.getElementById('adminTeamsSection').classList.toggle('hidden', selected !== 'TEAMS');
    document.getElementById('adminPanel').classList.toggle('hidden', selected !== 'SETTINGS');
    ['Operations', 'Teams', 'Settings'].forEach(function (name) {
      const active = name.toUpperCase() === selected;
      const tab = document.getElementById('adminSectionTab' + name);
      tab.classList.toggle('active', active);
      tab.setAttribute('aria-selected', active ? 'true' : 'false');
    });
    if (selected === 'SETTINGS') {
      loadAdminSettings();
      loadAdminOperations();
    } else if (selected === 'TEAMS') {
      loadAdminTeams_();
    } else {
      loadAdminOperations();
    }
  }

  function switchEnvironment(environment) {
    if (state.config && state.config.environment.key === environment) return;
    clearTimeout(state.poller);
    state.poller = null;
    state.dashboardRequestId += 1;
    closeDrawer();
    const banner = document.getElementById('statusBanner');
    clearAppErrorBanner_();
    banner.classList.remove('hidden');
    banner.textContent = 'Switching to ' + environment + '…';
    document.getElementById('assetRows').innerHTML = '<tr><td colspan="11" class="empty">Loading ' + escapeHtml(environment) + ' assets…</td></tr>';
    runServer('setActiveEnvironment', environment, function (config) {
      applyClientConfig(config);
      showToast('Viewing ' + environment + '.');
    });
  }

  function runServer(name, argument, success) {
    const loadingToken = beginServerLoading_('Loading application', 'Completing the requested operation…');
    let runner = google.script.run.withSuccessHandler(function (result) {
      endServerLoading_(loadingToken);
      clearAppErrorBanner_();
      if (success) success(result);
    }).withFailureHandler(function (error) { endServerLoading_(loadingToken); showAppError_(error, 'Unable to complete the request.'); });
    if (argument === null || argument === undefined) runner[name](); else runner[name](argument);
  }

  function loadDashboard(page, options) {
    const loadOptions = options || {};
    state.page = page || state.page;
    clearBulkSelection();
    showAssetTableLoading_('Loading matching assets…');
    const requestId = ++state.dashboardRequestId;
    const loadingToken = loadOptions.tableOnlyLoading
      ? null
      : beginServerLoading_('Loading dashboard', 'Refreshing metrics, statuses, and matching assets…');
    const activeEnvironment = state.config.environment.key;
    const request = {
      page: state.page, pageSize: 50,
      search: document.getElementById('search').value,
      assetStatuses: state.dashboardFilters.assetStatus.slice(),
      lifecycleStatuses: state.dashboardFilters.lifecycle.slice(),
      assetTypes: state.dashboardFilters.assetType.slice(),
      environments: state.dashboardFilters.environment.slice(),
      stewards: state.dashboardFilters.stewardship.slice(),
      domains: state.dashboardFilters.domain.slice()
    };
    let runner = google.script.run.withSuccessHandler(function (data) {
      if (loadingToken) endServerLoading_(loadingToken);
      if (requestId !== state.dashboardRequestId || state.config.environment.key !== activeEnvironment) return;
      clearAppErrorBanner_();
      renderDashboard(data);
    }).withFailureHandler(function (error) {
      if (loadingToken) endServerLoading_(loadingToken);
      if (requestId !== state.dashboardRequestId || state.config.environment.key !== activeEnvironment) return;
      const body = document.getElementById('assetRows');
      const info = showAppError_(error, 'Unable to load the dashboard table.');
      body.setAttribute('aria-busy', 'false');
      body.innerHTML = '<tr><td colspan="11"><div class="section-load-error"><strong>' + escapeHtml(info.title) + '</strong><span>' + escapeHtml(info.message) + '</span><button class="button subtle" type="button" onclick="' + (info.isAuth ? 'refreshApplication_()' : 'loadDashboard(state.page)') + '">' + (info.isAuth ? 'Refresh & sign in' : 'Try again') + '</button></div></td></tr>';
    });
    runner.getDashboard(request);
  }

  function showAssetTableLoading_(message) {
    const body = document.getElementById('assetRows');
    body.setAttribute('aria-busy', 'true');
    body.innerHTML = '<tr><td colspan="11"><div class="section-loading compact"><div class="loading-spinner" aria-hidden="true"></div><span>' + escapeHtml(message || 'Loading assets…') + '</span></div></td></tr>';
    document.getElementById('selectAllAssets').disabled = true;
  }

  function renderDashboard(data) {
    document.getElementById('snapshotAt').textContent = data.snapshotAt ? formatDate(data.snapshotAt) : 'Not imported';
    const metrics = [
      ['Source rows reviewed', formatNumber(data.metrics.sourceRows), 'safe'], ['Lifecycle records', formatNumber(data.metrics.totalAssets), 'safe'],
      ['Stale candidates', formatNumber(data.metrics.staleAssets), 'action'], ['Missing Slack contact', formatNumber(data.metrics.needsOwner), 'action'],
      ['Ready for quarantine', formatNumber(data.metrics.quarantineReady), 'action'], ['Quarantined / purge ≤30d', formatNumber(data.metrics.quarantined) + ' / ' + formatNumber(data.metrics.purgeWithin30), 'excluded']
    ];
    document.getElementById('metrics').innerHTML = metrics.map(function (metric) {
      return '<div class="metric ' + metric[2] + '"><span class="label">' + escapeHtml(metric[0]) + '</span><span class="value">' + escapeHtml(metric[1]) + '</span></div>';
    }).join('');
    renderBreakdown(data.breakdowns.state);
    renderBreakdownInto_('assetStatusBreakdown', data.breakdowns.assetStatus || [], 'ASSET');
    renderDashboardFilters_(data.filterOptions || {});
    renderAssets(data.assets);
    state.pages = data.pagination.pages;
    state.page = data.pagination.page;
    const selectedStatuses = state.dashboardFilters.assetStatus;
    const isCandidates = selectedStatuses.length === 1 && selectedStatuses[0] === 'STALE' && !state.dashboardFilters.lifecycle.length;
    document.getElementById('assetCount').textContent = formatNumber(data.pagination.total) + (isCandidates ? ' candidates requiring review' : ' matching assets');
    document.getElementById('pageLabel').textContent = 'Page ' + state.page + ' of ' + state.pages;
    if (state.pendingAssetId) {
      const assetId = state.pendingAssetId;
      state.pendingAssetId = '';
      openAsset(assetId);
    }
  }

  function renderDashboardFilters_(options) {
    const supplied = options || {};
    state.dashboardFilterOptions = {
      assetStatuses: supplied.assetStatuses || state.dashboardFilterOptions.assetStatuses || ['STALE', 'ACTIVE', 'QUARANTINED', 'PURGED'],
      lifecycleStatuses: supplied.lifecycleStatuses || state.dashboardFilterOptions.lifecycleStatuses || dashboardLifecycleStatuses_(),
      assetTypes: supplied.assetTypes || state.dashboardFilterOptions.assetTypes || [],
      environments: supplied.environments || state.dashboardFilterOptions.environments || [],
      stewards: supplied.stewards || state.dashboardFilterOptions.stewards || [],
      domains: supplied.domains || state.dashboardFilterOptions.domains || []
    };
    const statusOptions = valueOptions_(state.dashboardFilterOptions.assetStatuses).map(function (option) {
      option.group = 'Asset status';
      option.filterKey = 'assetStatus';
      return option;
    }).concat(valueOptions_(state.dashboardFilterOptions.lifecycleStatuses).map(function (option) {
      option.group = 'Lifecycle status';
      option.filterKey = 'lifecycle';
      return option;
    }));
    renderDashboardMultiSelect_('assetStatusFilter', 'assetStatus', 'All statuses', statusOptions, ['assetStatus', 'lifecycle']);
    renderDashboardMultiSelect_('assetTypeFilter', 'assetType', 'All asset types', valueOptions_(state.dashboardFilterOptions.assetTypes));
    renderDashboardMultiSelect_('environmentFilter', 'environment', 'All environments', valueOptions_(state.dashboardFilterOptions.environments));
    renderDashboardMultiSelect_('stewardshipFilter', 'stewardship', 'All stewards', valueOptions_(state.dashboardFilterOptions.stewards));
    renderDashboardMultiSelect_('domainFilter', 'domain', 'All domains', valueOptions_(state.dashboardFilterOptions.domains));
    updateDashboardQueueTitle_();
  }

  function valueOptions_(values) {
    return (values || []).map(function (value) { return { value: value, label: humanizeFilterValue_(value) }; });
  }

  function dashboardLifecycleStatuses_() {
    return ['ACTIVE', 'DETECTED', 'NOTIFIED', 'CONTESTED', 'ACCEPTED', 'EXEMPT', 'EXEMPTED', 'DISMISSED', 'RESTRICTED', 'QUARANTINED', 'PURGE_ELIGIBLE', 'SELF_PURGE_PENDING', 'RESTORED', 'PURGED', 'EXCLUDED'];
  }

  function humanizeFilterValue_(value) {
    return String(value || '').toLowerCase().replace(/_/g, ' ').replace(/(^|\s)\S/g, function (letter) { return letter.toUpperCase(); });
  }

  function renderDashboardMultiSelect_(containerId, key, allLabel, options, clearKeys) {
    const container = document.getElementById(containerId);
    if (!container) return;
    const isOpen = state.openDashboardFilter === containerId;
    const displayedFilters = isOpen && state.pendingDashboardFilters ? state.pendingDashboardFilters : state.dashboardFilters;
    const selectedOptions = options.filter(function (option) {
      return (displayedFilters[option.filterKey || key] || []).indexOf(option.value) !== -1;
    });
    const selectedLookup = {};
    selectedOptions.forEach(function (option) { selectedLookup[(option.filterKey || key) + ':' + option.value] = true; });
    const optionLookup = {};
    options.forEach(function (option) { optionLookup[option.value] = option; });
    let triggerLabel = allLabel;
    if (selectedOptions.length === 1) triggerLabel = selectedOptions[0].shortLabel || selectedOptions[0].label;
    if (selectedOptions.length > 1) triggerLabel = (selectedOptions[0].shortLabel || selectedOptions[0].label) + ' +' + (selectedOptions.length - 1);
    const groups = [];
    options.forEach(function (option) {
      const group = option.group || '';
      if (!groups.length || groups[groups.length - 1].name !== group) groups.push({ name: group, options: [] });
      groups[groups.length - 1].options.push(option);
    });
    const menu = options.length ? groups.map(function (group) {
      const heading = group.name ? '<div class="multi-select-group-label">' + escapeHtml(group.name) + '</div>' : '';
      return '<div class="multi-select-group">' + heading + group.options.map(function (option) {
        const optionKey = option.filterKey || key;
        return '<label class="multi-select-option"><input type="checkbox" data-filter-key="' + escapeHtml(optionKey) + '" data-filter-value="' + escapeHtml(option.value) + '" ' + (selectedLookup[optionKey + ':' + option.value] ? 'checked' : '') + ' onchange="dashboardMultiSelectChanged_(this)"><span>' + escapeHtml(option.label) + '</span></label>';
      }).join('') + '</div>';
    }).join('') : '<div class="multi-select-empty">No options in the current data.</div>';
    const keysToClear = (clearKeys && clearKeys.length ? clearKeys : [key]).join(',');
    const hasPendingChanges = isOpen && !dashboardFiltersEqual_(state.dashboardFilters, state.pendingDashboardFilters);
    container.innerHTML = '<button type="button" class="multi-select-trigger" aria-haspopup="true" aria-expanded="' + (isOpen ? 'true' : 'false') + '" onclick="toggleDashboardMultiSelect_(event, \'' + containerId + '\')"><span>' + escapeHtml(triggerLabel) + '</span><span class="multi-select-chevron" aria-hidden="true">⌄</span></button>' +
      '<div class="multi-select-menu ' + (isOpen ? '' : 'hidden') + '" onclick="event.stopPropagation()">' + menu + '<div class="multi-select-footer"><button type="button" class="multi-select-clear" data-filter-keys="' + escapeHtml(keysToClear) + '" onclick="clearDashboardMultiSelect_(event, \'' + keysToClear + '\')" ' + (selectedOptions.length ? '' : 'disabled') + '>Clear</button><button type="button" class="button primary multi-select-apply" onclick="applyDashboardMultiSelect_(event)" ' + (hasPendingChanges ? '' : 'disabled') + '>Apply</button></div></div>';
  }

  function toggleDashboardMultiSelect_(event, containerId) {
    event.stopPropagation();
    const isClosing = state.openDashboardFilter === containerId;
    state.openDashboardFilter = isClosing ? '' : containerId;
    state.pendingDashboardFilters = isClosing ? null : cloneDashboardFilters_(state.dashboardFilters);
    renderDashboardFilters_(state.dashboardFilterOptions);
  }

  function dashboardMultiSelectChanged_(checkbox) {
    const key = checkbox.getAttribute('data-filter-key');
    const value = checkbox.getAttribute('data-filter-value');
    if (!state.pendingDashboardFilters) state.pendingDashboardFilters = cloneDashboardFilters_(state.dashboardFilters);
    const selected = (state.pendingDashboardFilters[key] || []).slice();
    const position = selected.indexOf(value);
    if (checkbox.checked && position === -1) selected.push(value);
    if (!checkbox.checked && position !== -1) selected.splice(position, 1);
    state.pendingDashboardFilters[key] = selected;
    updateDashboardMultiSelectActions_(checkbox);
  }

  function clearDashboardMultiSelect_(event, key) {
    event.stopPropagation();
    if (!state.pendingDashboardFilters) state.pendingDashboardFilters = cloneDashboardFilters_(state.dashboardFilters);
    const filterKeys = String(key || '').split(',');
    filterKeys.forEach(function (filterKey) { state.pendingDashboardFilters[filterKey] = []; });
    const menu = event.currentTarget && event.currentTarget.closest('.multi-select-menu');
    if (menu) {
      menu.querySelectorAll('input[data-filter-key]').forEach(function (checkbox) {
        if (filterKeys.indexOf(checkbox.getAttribute('data-filter-key')) !== -1) checkbox.checked = false;
      });
    }
    updateDashboardMultiSelectActions_(event.currentTarget);
  }

  function updateDashboardMultiSelectActions_(element) {
    const menu = element && element.closest ? element.closest('.multi-select-menu') : null;
    if (!menu) return;
    const clearButton = menu.querySelector('.multi-select-clear');
    const applyButton = menu.querySelector('.multi-select-apply');
    const clearKeys = String(clearButton ? clearButton.getAttribute('data-filter-keys') : '').split(',').filter(Boolean);
    if (clearButton) clearButton.disabled = !clearKeys.some(function (key) { return (state.pendingDashboardFilters[key] || []).length; });
    if (applyButton) applyButton.disabled = dashboardFiltersEqual_(state.dashboardFilters, state.pendingDashboardFilters);
  }

  function applyDashboardMultiSelect_(event) {
    event.stopPropagation();
    if (!state.pendingDashboardFilters || dashboardFiltersEqual_(state.dashboardFilters, state.pendingDashboardFilters)) return;
    state.dashboardFilters = cloneDashboardFilters_(state.pendingDashboardFilters);
    state.pendingDashboardFilters = null;
    state.openDashboardFilter = '';
    renderDashboardFilters_(state.dashboardFilterOptions);
    loadDashboard(1, { tableOnlyLoading: true });
  }

  function cloneDashboardFilters_(filters) {
    const source = filters || {};
    return {
      assetStatus: (source.assetStatus || []).slice(),
      lifecycle: (source.lifecycle || []).slice(),
      assetType: (source.assetType || []).slice(),
      environment: (source.environment || []).slice(),
      stewardship: (source.stewardship || []).slice(),
      domain: (source.domain || []).slice()
    };
  }

  function dashboardFiltersEqual_(left, right) {
    if (!left || !right) return false;
    return ['assetStatus', 'lifecycle', 'assetType', 'environment', 'stewardship', 'domain'].every(function (key) {
      return JSON.stringify(left[key] || []) === JSON.stringify(right[key] || []);
    });
  }

  function updateDashboardQueueTitle_() {
    const selected = state.dashboardFilters.assetStatus || [];
    const selectedLifecycle = state.dashboardFilters.lifecycle || [];
    let title = 'Filtered assets';
    if (!selected.length && !selectedLifecycle.length) title = 'All assets';
    else if (selected.length === 1 && !selectedLifecycle.length) title = humanizeFilterValue_(selected[0]) + ' assets';
    else if (!selected.length && selectedLifecycle.length === 1) title = humanizeFilterValue_(selectedLifecycle[0]) + ' assets';
    document.getElementById('queueTitle').textContent = title;
  }

  function renderBreakdown(items) {
    renderBreakdownInto_('stateBreakdown', items, 'LIFECYCLE');
  }

  function renderBreakdownInto_(targetId, items, type) {
    const target = document.getElementById(targetId);
    if (!items.length) { target.innerHTML = '<div class="empty">No evaluated data yet.</div>'; return; }
    const max = Math.max.apply(null, items.map(function (item) { return item.value; }));
    target.innerHTML = items.slice(0, 10).map(function (item) {
      const description = dashboardStatusDescription_(type, item.label);
      return '<div class="bar-row"><span class="bar-label-copy"><span class="bar-label">' + escapeHtml(item.label) + '</span><span class="bar-help">' + escapeHtml(description) + '</span></span><div class="bar-track"><div class="bar-fill" style="width:' + Math.max(2, item.value * 100 / max) + '%"></div></div><span class="bar-value">' + formatNumber(item.value) + '</span></div>';
    }).join('');
  }

  function renderAssets(assets) {
    const body = document.getElementById('assetRows');
    body.setAttribute('aria-busy', 'false');
    state.currentAssets = assets;
    document.getElementById('selectAllAssets').disabled = assets.length === 0;
    if (!assets.length) { body.innerHTML = '<tr><td colspan="11" class="empty">No assets match these filters.</td></tr>'; updateBulkSelectionUi(); return; }
    body.innerHTML = assets.map(function (asset) {
      const noRead = ['NEW_UNREAD', 'STALE_NO_READ_IN_AVAILABLE_HISTORY'].indexOf(asset.sourceActivityStatus) !== -1;
      const signalGap = /^(INVALID_|MISSING_)/.test(asset.sourceActivityStatus || '');
      const readInactivity = asset.daysInactive === null
        ? 'Read staleness signal unavailable'
        : formatNumber(asset.daysInactive) + (noRead ? ' days since creation (no reads)' : ' days since last read');
      const reason = asset.assetStatus === 'PURGED' ? 'Deletion verified in latest complete extract' : asset.assetStatus === 'QUARANTINED' ? 'Snowflake status is RESTRICTED' : signalGap ? 'Read staleness signal unavailable · lifecycle retained' : asset.assetStatus === 'STALE' ? readInactivity + ' · application threshold met' : 'Read activity is within the configured threshold';
      const checkbox = '<input class="asset-select" type="checkbox" value="' + escapeHtml(asset.assetId) + '" aria-label="Select ' + escapeHtml(asset.objectFqn) + '" onclick="event.stopPropagation()" onchange="toggleAssetSelection(this.value,this.checked)">';
      const stewardship = asset.businessSteward || asset.technicalSteward || 'No Slack email';
      const domain = asset.domain + (asset.subDomain ? ' · ' + asset.subDomain : '');
      const assetType = humanizeFilterValue_(asset.assetType || 'UNKNOWN');

      const rowCountTitle = rowCountClass ? 'This asset currently reports zero rows.' : rowCount + ' rows';

    }).join('');

  function toggleAssetSelection(assetId, checked) {
    if (checked) state.selectedAssets[assetId] = true;
    else delete state.selectedAssets[assetId];
    updateBulkSelectionUi();
  }

  function toggleSelectAll(checked) {
    document.querySelectorAll('.asset-select').forEach(function (input) {
      input.checked = checked;
      if (checked) state.selectedAssets[input.value] = true;
      else delete state.selectedAssets[input.value];
    });
    updateBulkSelectionUi();
  }

  function clearBulkSelection() {
    state.selectedAssets = {};
    document.querySelectorAll('.asset-select').forEach(function (input) { input.checked = false; });
    updateBulkSelectionUi();
  }

  function updateBulkSelectionUi() {
    const selectedIds = Object.keys(state.selectedAssets);
    const selectedCount = selectedIds.length;
    const bar = document.getElementById('bulkActionBar');
    if (!bar) return;
    bar.classList.toggle('hidden', selectedCount === 0);
    document.getElementById('bulkSelectedCount').textContent = selectedCount;
    const selectedAssets = selectedIds.map(function (assetId) {
      return state.currentAssets.find(function (asset) { return asset.assetId === assetId; });
    }).filter(Boolean);
    const buttons = {
      confirm: document.getElementById('bulkConfirmButton'),
      contest: document.getElementById('bulkContestButton'),
      selfPurge: document.getElementById('bulkSelfPurgeButton'),
      restore: document.getElementById('bulkRestoreButton'),
      dismiss: document.getElementById('bulkDismissButton')
    };
    Object.keys(buttons).forEach(function (action) {
      if (!buttons[action]) return;
      const available = selectedAssets.length === selectedCount && selectedAssets.every(function (asset) {
        return assetActionEligibility_(asset)[action];
      });
      buttons[action].classList.toggle('hidden', !available);
    });
    const visible = Array.from(document.querySelectorAll('.asset-select'));
    const selectAll = document.getElementById('selectAllAssets');
    if (selectAll) {
      selectAll.checked = visible.length > 0 && visible.every(function (input) { return input.checked; });
      selectAll.indeterminate = visible.some(function (input) { return input.checked; }) && !selectAll.checked;
    }
  }

  function setBulkBusy(busy) {
    document.querySelectorAll('[data-bulk-action]').forEach(function (button) { button.disabled = busy; });
  }

  function exportSelectedAssets_() {
    const assetIds = Object.keys(state.selectedAssets);
    if (!assetIds.length) return;
    setBulkBusy(true);
    const loadingToken = beginServerLoading_('Preparing asset export', 'Collecting all record fields for ' + assetIds.length + ' selected asset' + (assetIds.length === 1 ? '' : 's') + '…', true);
    google.script.run.withSuccessHandler(function (exportData) {
      downloadCsvFile_(exportData);
      endServerLoading_(loadingToken);
      setBulkBusy(false);
      showToast(exportData.rows.length + ' asset record' + (exportData.rows.length === 1 ? '' : 's') + ' exported.');
    }).withFailureHandler(function (error) {
      endServerLoading_(loadingToken);
      setBulkBusy(false);
      showAppError_(error, 'Unable to export the selected assets.');
    }).prepareAssetDetailsExport({ assetIds: assetIds });
  }

  function runBulkTransition(action) {
    const assetIds = Object.keys(state.selectedAssets);
    if (!assetIds.length) return;
    const label = action === 'CONFIRM_DEPRECATION' ? 'confirm deprecation for' : 'dismiss';
    const isConfirm = action === 'CONFIRM_DEPRECATION';
    showConfirmation({
      title: isConfirm ? 'Confirm deprecation' : 'Dismiss candidates',
      message: 'Apply ' + label + ' ' + assetIds.length + ' selected candidate' + (assetIds.length === 1 ? '' : 's') + '?',
      detail: isConfirm ? 'One consolidated Slack notification per recipient will be sent automatically after the records are confirmed.' : 'The selected records will leave the active deprecation path. No Slack notification will be sent.',
      confirmLabel: isConfirm ? 'Confirm deprecation' : 'Dismiss',
      confirmClass: isConfirm ? 'confirm-deprecation' : 'dismiss',
      iconClass: isConfirm ? 'green' : ''
    }, function () {
      setBulkBusy(true);
      const loadingToken = beginServerLoading_(isConfirm ? 'Confirming deprecation' : 'Dismissing assets', 'Updating the selected lifecycle records and completing related automation…');
      google.script.run.withSuccessHandler(function (result) {
        endServerLoading_(loadingToken);
        setBulkBusy(false);
        clearBulkSelection();

        const summary = result.processed + ' processed' + (result.skipped ? ', ' + result.skipped + ' skipped' : '') + (result.failed ? ', ' + result.failed + ' failed' : '') + '.' + notificationSummary;

      }).bulkTransitionCandidates({ assetIds: assetIds, action: action });

    const assetIds = Object.keys(state.selectedAssets);
    if (!assetIds.length) return;
    setBulkBusy(true);
    const loadingToken = beginServerLoading_('Preparing contest', 'Loading the exception request workflow for the selected assets…');
    google.script.run.withSuccessHandler(function (result) {
      endServerLoading_(loadingToken);
      setBulkBusy(false);
      openContestFlow(assetIds, result.url);
    }).withFailureHandler(function (error) {
      endServerLoading_(loadingToken);
      setBulkBusy(false);
      showToast(error.message || String(error), true);
    }).getBulkExceptionRequestUrl(assetIds);
  }

  function assetActionEligibility_(asset) {
    const status = String(asset.assetStatus || asset.ASSET_STATUS || '').toUpperCase();
    const lifecycle = String(asset.lifecycleState || asset.LIFECYCLE_STATE || '').toUpperCase();
    const permissions = asset.permissions || {};
    const canRespond = Boolean(permissions.canRespond) && !permissions.readOnly;
    const canAdmin = Boolean(permissions.canAdmin) && !permissions.readOnly;
    const stale = status === 'STALE';
    const quarantined = status === 'QUARANTINED';
    return {
      confirm: canRespond && stale && ['NOTIFIED', 'CONTESTED'].indexOf(lifecycle) !== -1,
      contest: canRespond && stale && ['NOTIFIED', 'ACCEPTED'].indexOf(lifecycle) !== -1,
      selfPurge: canRespond && stale && ['DETECTED', 'NOTIFIED', 'CONTESTED', 'ACCEPTED'].indexOf(lifecycle) !== -1,
      restore: canRespond && quarantined && ['QUARANTINED', 'PURGE_ELIGIBLE', 'SELF_PURGE_PENDING'].indexOf(lifecycle) !== -1,
      dismiss: canAdmin && stale && ['DETECTED', 'NOTIFIED', 'CONTESTED', 'ACCEPTED', 'SELF_PURGE_PENDING'].indexOf(lifecycle) !== -1
    };
  }

  function requestBulkSelfPurge_() {
    requestSelfPurgeFlow_(Object.keys(state.selectedAssets), '');
  }

  function requestBulkRestore_() {
    requestRestoreFlow_(Object.keys(state.selectedAssets), '');
  }

  function requestSelfPurgeFlow_(assetIds, reopenAssetId) {
    const ids = assetIds || [];
    if (!ids.length) return;
    showConfirmation({
      title: 'Accept responsibility for self purge',
      message: 'You are confirming that you are responsible for permanently deleting ' + ids.length + ' selected asset' + (ids.length === 1 ? '' : 's') + '.',
      detail: 'After confirmation, lifecycle notifications, reminders, and pending partner handoffs stop for the selected asset. The record remains SELF_PURGE_PENDING until a later complete import verifies that it is absent; verification then moves it to PURGED without sending a completion notification.',
      confirmLabel: 'Accept & self purge',
      confirmClass: 'dismiss'
    }, function () {
      showWorkflowLoading_('Recording self-purge intent', 'Updating the lifecycle records and preparing them for absence verification on a later import…');
      google.script.run.withSuccessHandler(function (result) {
        hideWorkflowLoading_();
        clearBulkSelection();
        loadDashboard(state.page);
        if (reopenAssetId) openAsset(reopenAssetId);
        showToast(result.processed + ' recorded' + (result.skipped ? ', ' + result.skipped + ' skipped' : '') + (result.failed ? ', ' + result.failed + ' failed' : '') + '.', Boolean(result.failed));
      }).withFailureHandler(function (error) {
        hideWorkflowLoading_();
        showAppError_(error, 'Unable to record self-purge intent.');
      }).requestSelfPurge({ assetIds: ids });
    });
  }

  function requestRestoreFlow_(assetIds, reopenAssetId) {
    const ids = assetIds || [];
    if (!ids.length) return;
    showConfirmation({
      title: 'Restore quarantined access',
      message: 'Prepare an access-restoration handoff for ' + ids.length + ' quarantined asset' + (ids.length === 1 ? '' : 's') + '?',
      detail: 'This creates a READY restoration request for the platform team. Lifecycle state changes after the restoration is completed and verified.',
      confirmLabel: 'Restore',
      confirmClass: 'primary',
      iconClass: 'green'
    }, function () {
      showWorkflowLoading_('Preparing restoration', 'Creating the platform restoration request…');
      google.script.run.withSuccessHandler(function (result) {
        hideWorkflowLoading_();
        clearBulkSelection();
        loadDashboard(state.page);
        if (state.config.user.isAdmin) loadAdminOperations();
        if (reopenAssetId) openAsset(reopenAssetId);
        showToast(result.processed + ' restoration request' + (result.processed === 1 ? '' : 's') + ' prepared' + (result.skipped ? ', ' + result.skipped + ' skipped' : '') + (result.failed ? ', ' + result.failed + ' failed' : '') + '.', Boolean(result.failed));
      }).withFailureHandler(function (error) {
        hideWorkflowLoading_();
        showAppError_(error, 'Unable to prepare restoration.');
      }).requestAssetRestorations({ assetIds: ids });
    });
  }

  function renderIntegrations(integrations) {
    const items = [

    ];
    document.getElementById('integrationStatus').innerHTML = items.map(function (item) {
      let label = item[1].blocked ? 'BLOCKED' : (item[1].enabled && item[1].configured ? 'READY' : item[1].configured ? 'CONFIGURED' : 'DRAFT ONLY');
      return '<div class="integration"' + (item[1].reason ? ' title="' + escapeHtml(item[1].reason) + '"' : '') + '><span>' + escapeHtml(item[0]) + '</span>' + badge(label) + '</div>';
    }).join('');
  }

  function loadAdminOperations() {
    if (!state.config || !state.config.user.isAdmin) return;
    setAdminOperationsLoading_();
    const loadingToken = beginServerLoading_('Loading admin operations', 'Refreshing handoff controls and assets ready for partner teams…');
    google.script.run.withSuccessHandler(function (operations) {
      endServerLoading_(loadingToken);
      renderAdminOperations(operations);
    }).withFailureHandler(function (error) {
      endServerLoading_(loadingToken);
      renderAdminOperationsError_(error.message || String(error));

    }).getAdminOperations();

  function setAdminOperationsLoading_() {
    document.getElementById('handoffControls').innerHTML = '<div class="section-loading"><div class="loading-spinner" aria-hidden="true"></div><span>Loading platform handoff controls…</span></div>';
    document.getElementById('adminHandoffGroups').innerHTML = '<div class="section-loading"><div class="loading-spinner" aria-hidden="true"></div><span>Loading assets ready for handoff…</span></div>';
  }

  function renderAdminOperationsError_(message) {
    const copy = escapeHtml(appErrorInfo_(message, 'Unable to load platform handoffs.').message);
    document.getElementById('handoffControls').innerHTML = '<div class="section-load-error">' + copy + '</div>';
    document.getElementById('adminHandoffGroups').innerHTML = '<div class="section-load-error">' + copy + '</div>';
  }

  function renderAdminOperations(data) {
    state.adminOperations = data;
    state.config.integrations = data.integrations || state.config.integrations;
    renderHandoffControls(data.actions || [], state.config.integrations);
    renderAdminImportSummary(state.config.importStatus);
    const actions = data.actions || [];
    const handoffGroups = [
      { action: 'QUARANTINE', title: 'Quarantine handoffs', description: 'Assets approved for Snowflake access restriction.', buttonClass: 'subtle', exportLabel: 'quarantine' },
      { action: 'RESTORE', title: 'Restoration handoffs', description: 'Quarantined assets approved to return to active platform access.', buttonClass: 'subtle', exportLabel: 'restoration' },
      { action: 'PURGE', title: 'Purge handoffs', description: 'Purge-eligible assets with completed pre-purge attestation.', buttonClass: 'danger', exportLabel: 'purge' }
    ];
    document.getElementById('adminHandoffGroups').innerHTML = handoffGroups.map(function (group) {
      const groupActions = actions.filter(function (item) { return String(item.action || '').toUpperCase() === group.action; });
      const purgeHolds = group.action === 'PURGE' ? (data.purgeHolds || []) : [];
      const eligiblePurgeCount = group.action === 'PURGE' ? Number(data.eligiblePurgeCount || 0) : 0;
      const prepareButton = eligiblePurgeCount
        ? '<button class="button danger" ' + (state.config.environment.readOnly ? 'disabled' : '') + ' onclick="preparePurgeHandoffs(' + eligiblePurgeCount + ')">Prepare purge handoffs (' + formatNumber(eligiblePurgeCount) + ')</button>'
        : '';
      const exportButton = groupActions.length
        ? '<button class="button ' + group.buttonClass + '" ' + (state.config.environment.readOnly ? 'disabled' : '') + ' onclick="downloadPlatformExport(\'' + group.action + '\')">Export ' + group.exportLabel + ' handoff</button>'
        : '';
      const rows = groupActions.length ? groupActions.map(function (item) { return renderAdminHandoffRow_(item, group.action); }).join('')
        : '<tr><td colspan="7" class="empty compact">' + (eligiblePurgeCount ? formatNumber(eligiblePurgeCount) + ' purge-eligible asset' + (eligiblePurgeCount === 1 ? ' is' : 's are') + ' awaiting batch preparation.' : 'No ' + group.exportLabel + ' handoffs are ready.') + '</td></tr>';
      const holdRows = purgeHolds.map(renderPurgeHoldRow_).join('');
      const holdSection = purgeHolds.length ? '<div class="purge-hold-section"><div class="purge-hold-heading"><div><strong>Assets on purge hold</strong><span>These assets remain quarantined and are excluded from purge exports.</span></div>' + badge(purgeHolds.length + ' ON HOLD') + '</div><div class="table-wrap admin-action-table"><table><thead><tr><th>Platform team</th><th>Object</th><th>Asset status</th><th>Lifecycle</th><th>Held since</th><th></th></tr></thead><tbody>' + holdRows + '</tbody></table></div></div>' : '';
      return '<section class="admin-handoff-group"><div class="admin-handoff-group-heading"><div><h4>' + escapeHtml(group.title) + '</h4><span>' + escapeHtml(group.description) + '</span></div><div class="top-actions">' + badge(groupActions.length + ' READY') + prepareButton + exportButton + '</div></div><div class="table-wrap admin-action-table"><table><thead><tr><th>Platform team</th><th>Handoff</th><th>Object</th><th>Asset status</th><th>Lifecycle</th><th>Ready since</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' + holdSection + '</section>';
    }).join('');
  }

  function renderAdminHandoffRow_(item, groupAction) {
      const cancel = groupAction === 'RESTORE' ? '<button class="button subtle" onclick="cancelRestorationHandoff_(' + JSON.stringify(item.actionId).replace(/"/g, '&quot;') + ')">Cancel restoration</button>' : '';
      return '<tr><td>' + escapeHtml(item.platform || 'SNOWFLAKE') + '</td><td>' + badge(item.action) + '</td><td class="object" title="' + escapeHtml(item.objectFqn) + '">' + escapeHtml(item.objectFqn) + '</td><td>' + badge(item.assetStatus) + '</td><td>' + badge(item.lifecycleState) + '</td><td>' + escapeHtml(formatDate(item.requestedAt)) + '</td><td>' + cancel + '</td></tr>';
  }

  function cancelRestorationHandoff_(actionId) {
    showConfirmation({
      title: 'Cancel access restoration',
      message: 'Cancel this READY restoration handoff?',
      detail: 'The asset will remain quarantined and return to the pre-purge review queue. No platform restoration request will be exported.',
      confirmLabel: 'Cancel restoration',
      confirmClass: 'dismiss'
    }, function () {
      showWorkflowLoading_('Cancelling restoration', 'Cancelling the READY handoff and returning the asset to pre-purge review…');
      google.script.run.withSuccessHandler(function (operations) {
        hideWorkflowLoading_();
        renderAdminOperations(operations);
        showToast('Restoration handoff cancelled. The asset is ready for pre-purge review.');
      }).withFailureHandler(function (error) {
        hideWorkflowLoading_();
        showToast(error.message || String(error), true);
      }).cancelRestorationHandoff(actionId);
    });
  }

  function renderPurgeHoldRow_(item) {
    return '<tr><td>' + escapeHtml(item.platform || 'SNOWFLAKE') + '</td><td class="object" title="' + escapeHtml(item.objectFqn) + '">' + escapeHtml(item.objectFqn) + '</td><td>' + badge(item.assetStatus) + '</td><td>' + badge(item.lifecycleState) + '</td><td>' + escapeHtml(formatDate(item.heldAt)) + '</td><td><button class="button subtle" onclick="releasePurgeHold_(' + JSON.stringify(item.actionId).replace(/"/g, '&quot;') + ')">Release hold</button></td></tr>';
  }

  function releasePurgeHold_(actionId) {
    showConfirmation({
      title: 'Release purge hold',
      message: 'Return this asset to the pre-purge review queue?',
      detail: 'Releasing the hold does not purge the asset. It will appear in the next purge preparation review and will require a new attestation.',
      confirmLabel: 'Release hold',
      confirmClass: 'primary'
    }, function () {
      showWorkflowLoading_('Releasing purge hold', 'Returning the quarantined asset to pre-purge review…');
      google.script.run.withSuccessHandler(function (operations) {
        hideWorkflowLoading_();
        renderAdminOperations(operations);
        showToast('Purge hold released. The asset is ready for pre-purge review.');
      }).withFailureHandler(function (error) {
        hideWorkflowLoading_();
        showToast(error.message || String(error), true);
      }).releasePurgeHold(actionId);
    });
  }

  function preparePurgeHandoffs(eligibleCount) {
    const eligibleAssets = (state.adminOperations && state.adminOperations.eligiblePurgeAssets) || [];
    const platforms = Array.from(new Set(eligibleAssets.map(function (item) { return item.platform || 'SNOWFLAKE'; }))).sort();
    const domains = Array.from(new Set(eligibleAssets.map(function (item) { return item.domain || 'Unassigned'; }))).sort();
    state.purgeReview = { assets: eligibleAssets, visibleAssets: eligibleAssets.slice(), restoreRequested: {}, holdRequested: {}, selection: {}, search: '', platform: 'ALL', domain: 'ALL', reviewStatus: 'ALL' };
    const platformOptions = platforms.map(function (value) { return '<option value="' + escapeHtml(value) + '">' + escapeHtml(value) + '</option>'; }).join('');
    const domainOptions = domains.map(function (value) { return '<option value="' + escapeHtml(value) + '">' + escapeHtml(value) + '</option>'; }).join('');
    const reviewHtml = '<div class="confirmation-review-heading"><div><strong>Assets included in this attestation</strong><span>Review the batch, restore access for assets returning to use, or place assets on hold while they remain quarantined.</span></div><strong id="purgeReviewSummary"></strong></div><div class="purge-review-filters"><input id="purgeReviewSearch" type="search" placeholder="Search object" aria-label="Search purge assets" oninput="schedulePurgeReviewFilter_()"><select id="purgeReviewPlatform" aria-label="Filter by platform" onchange="schedulePurgeReviewFilter_()"><option value="ALL">All platforms</option>' + platformOptions + '</select><select id="purgeReviewDomain" aria-label="Filter by domain" onchange="schedulePurgeReviewFilter_()"><option value="ALL">All domains</option>' + domainOptions + '</select><select id="purgeReviewStatus" aria-label="Filter by review status" onchange="schedulePurgeReviewFilter_()"><option value="ALL">All review statuses</option><option value="INCLUDED">Included for purge</option><option value="RESTORE">Restore access</option><option value="HOLD">Place on hold</option></select></div><div id="purgeReviewBulkBar" class="purge-review-bulk hidden"><strong><span id="purgeReviewSelectedCount">0</span> selected</strong><div><button class="button subtle" onclick="setSelectedPurgeDisposition_(\'RESTORE\')">Restore access selected</button><button class="button subtle" onclick="setSelectedPurgeDisposition_(\'HOLD\')">Place selected on hold</button><button class="button subtle" onclick="clearPurgeReviewSelection_()">Clear</button></div></div><div class="purge-review-table-shell"><div id="purgeReviewLoading" class="purge-review-loading hidden"><div class="loading-spinner" aria-hidden="true"></div><span>Updating review…</span></div><div class="confirmation-review-table"><table><thead><tr><th class="select-column"><input id="selectAllPurgeReview" type="checkbox" aria-label="Select all visible purge assets" onchange="toggleAllPurgeReview_(this.checked)"></th><th>Object</th><th>Platform</th><th>Domain</th><th>Lifecycle</th><th>Purge eligible</th><th></th></tr></thead><tbody id="purgeReviewRows"></tbody></table></div></div>';
    showConfirmation({
      title: 'Prepare purge handoffs',
      message: 'Prepare ' + formatNumber(eligibleCount) + ' purge-eligible asset' + (Number(eligibleCount) === 1 ? '' : 's') + ' for batch export?',
      detail: 'By continuing, you attest for every asset remaining in the purge batch that there is no legal hold, no regulatory or audit retention obligation, no pending restoration request, and EDG sign-off has been received. Assets marked Restore access or Place on hold are excluded from this attestation.',
      reviewHtml: reviewHtml,
      confirmLabel: 'Attest & prepare batch',
      confirmClass: 'danger',
      iconClass: 'red'
    }, function () {
      const review = state.purgeReview || { assets: [], restoreRequested: {}, holdRequested: {} };
      const includedAssetIds = review.assets.filter(function (item) { return !review.restoreRequested[item.assetId] && !review.holdRequested[item.assetId]; }).map(function (item) { return item.assetId; });
      const restoredAssetIds = review.assets.filter(function (item) { return review.restoreRequested[item.assetId]; }).map(function (item) { return item.assetId; });
      const heldAssetIds = review.assets.filter(function (item) { return review.holdRequested[item.assetId]; }).map(function (item) { return item.assetId; });
      showWorkflowLoading_('Saving purge review', 'Creating approved handoffs and recording any quarantined assets placed on purge hold…');
      google.script.run.withSuccessHandler(function (result) {
        hideWorkflowLoading_();
        renderAdminOperations(result.operations);
        const prepared = formatNumber(result.preparedCount) + ' purge handoff' + (Number(result.preparedCount) === 1 ? '' : 's') + ' prepared';
        const restored = Number(result.restoredCount || 0) ? '; ' + formatNumber(result.restoredCount) + ' sent to access restoration' : '';
        const held = Number(result.heldCount || 0) ? '; ' + formatNumber(result.heldCount) + ' placed on purge hold' : '';
        showToast(prepared + restored + held + '. Export the READY batches when you are ready to send them to the platform team.');
      }).withFailureHandler(function (error) {
        hideWorkflowLoading_();
        showToast(error.message || String(error), true);
      }).prepareEligiblePurgeHandoffs({
        assetIds: includedAssetIds,
        restoredAssetIds: restoredAssetIds,
        heldAssetIds: heldAssetIds,
        checks: { noLegalHold: true, noRegulatoryRetention: true, noPendingRestoration: true, edgSignoff: true }
      });
    });
    renderPurgeReviewRows_();
  }

  function schedulePurgeReviewFilter_() {
    if (!state.purgeReview) return;
    state.purgeReview.search = document.getElementById('purgeReviewSearch').value.trim().toLowerCase();
    state.purgeReview.platform = document.getElementById('purgeReviewPlatform').value;
    state.purgeReview.domain = document.getElementById('purgeReviewDomain').value;
    state.purgeReview.reviewStatus = document.getElementById('purgeReviewStatus').value;
    const loading = document.getElementById('purgeReviewLoading');
    if (loading) loading.classList.remove('hidden');
    window.clearTimeout(state.purgeReviewTimer);
    state.purgeReviewTimer = window.setTimeout(function () {
      renderPurgeReviewRows_();
      const currentLoading = document.getElementById('purgeReviewLoading');
      if (currentLoading) currentLoading.classList.add('hidden');
    }, 180);
  }

  function renderPurgeReviewRows_() {
    const review = state.purgeReview;
    const tbody = document.getElementById('purgeReviewRows');
    if (!review || !tbody) return;
    review.visibleAssets = review.assets.filter(function (item) {
      const restoreRequested = Boolean(review.restoreRequested[item.assetId]);
      const holdRequested = Boolean(review.holdRequested[item.assetId]);
      return (!review.search || String(item.objectFqn || '').toLowerCase().indexOf(review.search) !== -1) &&
        (review.platform === 'ALL' || String(item.platform || 'SNOWFLAKE') === review.platform) &&
        (review.domain === 'ALL' || String(item.domain || 'Unassigned') === review.domain) &&
        (review.reviewStatus === 'ALL' || (review.reviewStatus === 'RESTORE' && restoreRequested) || (review.reviewStatus === 'HOLD' && holdRequested) || (review.reviewStatus === 'INCLUDED' && !restoreRequested && !holdRequested));
    });
    tbody.innerHTML = review.visibleAssets.length ? review.visibleAssets.map(function (item) {
      const restoreRequested = Boolean(review.restoreRequested[item.assetId]);
      const holdRequested = Boolean(review.holdRequested[item.assetId]);
      const encodedId = JSON.stringify(item.assetId).replace(/"/g, '&quot;');
      const actions = restoreRequested || holdRequested
        ? '<button class="button subtle" onclick="setPurgeReviewDisposition_(' + encodedId + ',\'PURGE\')">Keep in purge</button>'
        : '<button class="button subtle" onclick="setPurgeReviewDisposition_(' + encodedId + ',\'RESTORE\')">Restore access</button><button class="button subtle" onclick="setPurgeReviewDisposition_(' + encodedId + ',\'HOLD\')">Place on hold</button>';
      return '<tr class="' + (restoreRequested ? 'purge-review-restore' : holdRequested ? 'purge-review-hold' : '') + '"><td><input class="purge-review-select" type="checkbox" aria-label="Select ' + escapeHtml(item.objectFqn) + '" ' + (review.selection[item.assetId] ? 'checked' : '') + ' onchange="togglePurgeReviewSelection_(' + encodedId + ',this.checked)"></td><td class="object" title="' + escapeHtml(item.objectFqn) + '">' + escapeHtml(item.objectFqn) + '</td><td>' + escapeHtml(item.platform || 'SNOWFLAKE') + '</td><td>' + escapeHtml(item.domain || 'Unassigned') + '</td><td>' + badge(item.lifecycleState) + '</td><td>' + escapeHtml(formatDate(item.purgeEligibleDate)) + '</td><td><div class="purge-review-row-actions">' + actions + '</div></td></tr>';
    }).join('') : '<tr><td colspan="7" class="empty compact">No assets match the current review filters.</td></tr>';
    updatePurgeReviewUi_();
  }

  function togglePurgeReviewSelection_(assetId, checked) {
    if (!state.purgeReview) return;
    if (checked) state.purgeReview.selection[assetId] = true;
    else delete state.purgeReview.selection[assetId];
    updatePurgeReviewUi_();
  }

  function toggleAllPurgeReview_(checked) {
    if (!state.purgeReview) return;
    state.purgeReview.visibleAssets.forEach(function (item) {
      if (checked) state.purgeReview.selection[item.assetId] = true;
      else delete state.purgeReview.selection[item.assetId];
    });
    renderPurgeReviewRows_();
  }

  function selectedPurgeReviewAssets_() {
    return state.purgeReview ? state.purgeReview.assets.filter(function (item) { return state.purgeReview.selection[item.assetId]; }) : [];
  }

  function setSelectedPurgeDisposition_(disposition) {
    selectedPurgeReviewAssets_().forEach(function (item) { setPurgeReviewDispositionValue_(item.assetId, disposition); });
    clearPurgeReviewSelection_();
  }

  function clearPurgeReviewSelection_() {
    if (!state.purgeReview) return;
    state.purgeReview.selection = {};
    renderPurgeReviewRows_();
  }

  function setPurgeReviewDispositionValue_(assetId, disposition) {
    if (!state.purgeReview) return;
    delete state.purgeReview.restoreRequested[assetId];
    delete state.purgeReview.holdRequested[assetId];
    if (disposition === 'RESTORE') state.purgeReview.restoreRequested[assetId] = true;
    if (disposition === 'HOLD') state.purgeReview.holdRequested[assetId] = true;
  }

  function setPurgeReviewDisposition_(assetId, disposition) {
    setPurgeReviewDispositionValue_(assetId, disposition);
    renderPurgeReviewRows_();
  }

  function updatePurgeReviewUi_() {
    const review = state.purgeReview;
    if (!review) return;
    const restoredCount = review.assets.filter(function (item) { return review.restoreRequested[item.assetId]; }).length;
    const heldCount = review.assets.filter(function (item) { return review.holdRequested[item.assetId]; }).length;
    const includedCount = review.assets.length - restoredCount - heldCount;
    const selectedCount = selectedPurgeReviewAssets_().length;
    const summary = document.getElementById('purgeReviewSummary');
    if (summary) summary.textContent = formatNumber(includedCount) + ' for purge · ' + formatNumber(restoredCount) + ' restore access · ' + formatNumber(heldCount) + ' on hold';
    const bulk = document.getElementById('purgeReviewBulkBar');
    if (bulk) bulk.classList.toggle('hidden', selectedCount === 0);
    const selected = document.getElementById('purgeReviewSelectedCount');
    if (selected) selected.textContent = selectedCount;
    const selectAll = document.getElementById('selectAllPurgeReview');
    if (selectAll) {
      const selectedVisible = review.visibleAssets.filter(function (item) { return review.selection[item.assetId]; }).length;
      selectAll.checked = review.visibleAssets.length > 0 && selectedVisible === review.visibleAssets.length;
      selectAll.indeterminate = selectedVisible > 0 && selectedVisible < review.visibleAssets.length;
    }
    const submit = document.getElementById('confirmationSubmit');
    if (submit) submit.textContent = includedCount ? 'Attest & prepare batch' : 'Save review decisions';
    const message = document.getElementById('confirmationMessage');
    if (message) message.textContent = includedCount ? 'Prepare ' + formatNumber(includedCount) + ' purge-eligible asset' + (includedCount === 1 ? '' : 's') + ' for batch export?' : 'Save the restoration and purge-hold decisions for this review?';
  }

  function renderHandoffControls(actions, integrations) {
    const platforms = [
      { key: 'SNOWFLAKE', label: 'Snowflake platform team', integration: integrations.snowflakeActions },
      { key: 'DATA360', label: 'Data 360 platform team', integration: integrations.data360Actions }
    ];
    document.getElementById('handoffControls').innerHTML = platforms.map(function (platform) {
      const ready = actions.filter(function (action) { return String(action.platform || 'SNOWFLAKE').toUpperCase() === platform.key; }).length;
      const item = platform.integration;
      const status = item.enabled ? 'ENABLED' : item.configured ? 'PAUSED' : 'NOT CONFIGURED';
      const disabled = state.config.environment.readOnly || (!item.configured && !item.enabled);

      return '<article class="handoff-control-card"><div class="handoff-control-heading"><strong>' + escapeHtml(platform.label) + '</strong>' + badge(status) + '</div><p>' + (item.enabled ? 'Dispatch is available for ready requests.' : 'Ready requests remain safely queued until this route is enabled.') + '</p><div class="handoff-control-meta"><span><strong>' + formatNumber(ready) + '</strong><br>ready assets</span><span><strong>' + (item.configured ? 'Yes' : 'No') + '</strong><br>endpoint configured</span></div><button class="button ' + (item.enabled ? 'subtle' : 'primary') + '" ' + (disabled ? 'disabled' : '') + ' onclick="togglePlatformHandoff(\'' + platform.key + '\',' + nextEnabled + ')">' + (item.enabled ? 'Pause handoff' : 'Enable handoff') + '</button></article>';

        : '';

      quarantineDays: document.getElementById('quarantineDays').value,

  function downloadPlatformExport(actionType) {
    const loadingToken = beginServerLoading_('Preparing handoff export', 'Building the ' + String(actionType || '').toLowerCase() + ' handoff file and updating its records…', true);
    google.script.run.withSuccessHandler(function (exportData) {
      if (!exportData.rows.length) {
        endServerLoading_(loadingToken);
        showToast('No READY ' + actionType.toLowerCase() + ' actions are available to export.');
        return;
      }
      downloadCsvFile_(exportData);
      google.script.run.withSuccessHandler(function (operations) {
        endServerLoading_(loadingToken);
        renderAdminOperations(operations);
        showToast(exportData.rows.length + ' ' + actionType.toLowerCase() + ' action' + (exportData.rows.length === 1 ? '' : 's') + ' exported and marked EXPORTED.');
      }).withFailureHandler(function (error) {
        endServerLoading_(loadingToken);
        showToast('CSV downloaded, but the handoff statuses could not be updated: ' + (error.message || String(error)), true);
      }).markPlatformActionsExported({ actionIds: exportData.actionIds });
    }).withFailureHandler(function (error) {
      endServerLoading_(loadingToken);
      showToast(error.message || String(error), true);
    }).preparePlatformExport(actionType);
  }

  function csvCell_(value) {
    const text = String(value === null || value === undefined ? '' : value);
    return /[",\r\n]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
  }

  function downloadCsvFile_(exportData) {
    const rows = [exportData.headers].concat(exportData.rows);
    const csv = rows.map(function (row) { return row.map(csvCell_).join(','); }).join('\r\n');
    const url = URL.createObjectURL(new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' }));
    const link = document.createElement('a');
    link.href = url;
    link.download = exportData.fileName;
    document.body.appendChild(link);
    link.click();
    link.remove();
    window.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

    document.getElementById('slackEnabled').checked = integrations.slack.enabled;
